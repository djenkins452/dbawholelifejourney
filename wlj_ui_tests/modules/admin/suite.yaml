  - id: "AC-THEME-003"
    name: "Theme list breadcrumb links back to dashboard"
    priority: "medium"
    tags: ["themes", "navigation"]
    steps:
      - action: "NAVIGATE"
        url: "/admin-console/themes/"
      - action: "WAIT"
        timeout_ms: 2000
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "ac-back-link"
        timeout_ms: 5000
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "url_contains"
        expected: "/admin-console/"


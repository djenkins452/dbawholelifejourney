{% load static %}
{# Legacy top bar — universal search + notifications #}
<header class="legacy-topbar">
    <form class="legacy-search" method="get" action="{% url 'legacy:search' %}" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="legacy-ico-sm legacy-search-ico"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" name="q" class="legacy-search-input"
               placeholder="Search Legacy…" autocomplete="off"
               aria-label="Search Legacy">
        <kbd class="legacy-kbd">⌘K</kbd>
    </form>

    <div class="legacy-topbar-right">
        <button type="button" class="legacy-bell" id="legacyBell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="legacy-ico-sm"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            {% if notification_count %}<span class="legacy-bell-badge">{{ notification_count }}</span>{% endif %}
        </button>
        <div class="legacy-notif-panel" id="legacyNotifPanel" hidden>
            <div class="legacy-notif-empty">You're all caught up.</div>
        </div>
    </div>
</header>

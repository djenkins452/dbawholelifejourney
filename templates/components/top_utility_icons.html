{% load static %}
<!-- Mobile Top-Right Utility Icons (Phase 1) -->
<div class="top-utility-icons">
    {# Favorites #}
    <a href="{% url 'dashboard:home' %}" class="utility-icon" aria-label="Favorites" title="Favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
    </a>

    {# Chat Bot / AI Assistant #}
    {% if ai_enabled and personal_assistant_enabled %}
    <a href="{% url 'ai:dashboard' %}" class="utility-icon" aria-label="Assistant" title="Assistant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
    </a>
    {% endif %}

    {# Notifications - reuse existing bell component logic #}
    <button type="button" class="utility-icon utility-icon-notifications" aria-label="Notifications" title="Notifications" onclick="toggleNotificationPanel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        {% if unread_notification_count %}
        <span class="utility-icon-badge">{{ unread_notification_count }}</span>
        {% endif %}
    </button>

    {# Profile #}
    <a href="{% url 'users:profile' %}" class="utility-icon utility-icon-profile" aria-label="Profile" title="Profile">
        {% if user.avatar %}
        <img src="{{ user.avatar.url }}" alt="" class="utility-icon-avatar">
        {% else %}
        <span class="utility-icon-initial">{{ user.get_initials }}</span>
        {% endif %}
    </a>
</div>

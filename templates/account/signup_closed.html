{% extends "account/base.html" %}

{% block title %}Sign Up Closed - Whole Life Journey{% endblock %}

{% block auth_content %}
<div class="text-center">
    <div class="auth-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-muted);">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </div>

    <h1>Sign Up Closed</h1>

    <p class="auth-message">
        We are currently not accepting new registrations. Please check back later or contact us for more information.
    </p>
</div>

<div class="auth-actions">
    <a href="{% url 'core:landing' %}" class="btn btn-outline" style="width: 100%;">
        Back to Home
    </a>
</div>

<style>
.auth-icon {
    margin-bottom: var(--space-6);
}

.auth-message {
    color: var(--color-text);
    margin-bottom: var(--space-6);
    line-height: 1.6;
}

.auth-actions {
    margin-top: var(--space-6);
}

.btn-outline {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    text-decoration: none;
    display: inline-block;
    text-align: center;
    transition: all 0.2s;
}

.btn-outline:hover {
    background: var(--color-surface);
    border-color: var(--color-primary);
}

.text-center {
    text-align: center;
}
</style>
{% endblock %}

{% extends "account/base.html" %}
{% load static %}

{% block title %}Password Changed - Whole Life Journey{% endblock %}

{% block auth_content %}
<div class="text-center">
    <div class="auth-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-success, #22c55e);">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
    </div>

    <h1>Password changed</h1>

    <p class="auth-message">
        Your password has been successfully reset. You can now sign in with your new password.
    </p>
</div>

<div class="auth-actions">
    <a href="{% url 'account_login' %}" class="btn btn-primary" style="width: 100%;">
        Sign In
    </a>
</div>

<style nonce="{{ csp_nonce }}">
.auth-icon {
    margin-bottom: var(--space-6);
}

.auth-message {
    color: var(--color-text);
    margin-bottom: var(--space-6);
    line-height: 1.6;
}

.auth-actions {
    margin-top: var(--space-6);
}

.text-center {
    text-align: center;
}
</style>
{% endblock %}

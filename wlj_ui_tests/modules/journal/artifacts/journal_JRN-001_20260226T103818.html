<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Critical CSS inlined to prevent FOUC -->
    <style>
    :root{--color-primary:#6b7280;--color-secondary:#f9fafb;--color-accent:#6366f1;--color-text:#374151;--color-text-muted:#6b7280;--color-background:#fff;--color-surface:#f9fafb;--color-border:#e5e7eb;--font-family-base:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--font-size-base:1rem;--line-height-base:1.5}
    *,*::before,*::after{box-sizing:border-box}*{margin:0}
    body{font-family:var(--font-family-base);font-size:var(--font-size-base);line-height:var(--line-height-base);color:var(--color-text);background-color:var(--color-background);min-height:100vh}
    </style>
    <title>Verify Your Email - Whole Life Journey</title>
    <link rel="stylesheet" href="/static/css/main.css?v=20260114e">
    <link rel="stylesheet" href="/static/css/themes.css?v=20260114e">
    <link rel="icon" type="image/png" href="/static/images/wlj-logo.png">
    
</head>
<body class="theme-minimal">
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <a href="/">
                    <img src="/static/images/wlj-logo.png" alt="Whole Life Journey" class="auth-logo">
                </a>
            </div>
            
            <div class="auth-card">
                
                
<h1>Check your email</h1>
<p>We've sent a verification link to your email address. Please click the link to verify your account.</p>

<div class="verification-info">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" class="verification-icon">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
    </svg>
    <p class="text-muted">Didn't receive the email? Check your spam folder or request a new link below.</p>
</div>

<a href="/accounts/email/" class="btn btn-secondary" style="width: 100%;">
    Manage Email Addresses
</a>

<p class="auth-link">
    <a href="/accounts/login/">Back to sign in</a>
</p>

<style nonce="">
.verification-info {
    text-align: center;
    padding: var(--space-6) 0;
}

.verification-icon {
    margin: 0 auto var(--space-4);
    color: var(--color-accent);
}
</style>

            </div>
            
            <div class="auth-footer">
                <p>© 2026 Beacon Innovations LLC</p>
            </div>
        </div>
    </div>
    
<style nonce="">
.auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--color-surface) 0%, var(--color-background) 100%);
    padding: var(--space-4);
}

.auth-container {
    width: 100%;
    max-width: 420px;
}

.auth-header {
    text-align: center;
    margin-bottom: var(--space-8);
}

.auth-logo {
    width: 120px;
    height: auto;
}

.auth-card {
    background: var(--color-background);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-8);
}

.auth-card h1 {
    font-size: var(--font-size-xl);
    text-align: center;
    margin-bottom: var(--space-6);
}

.auth-footer {
    text-align: center;
    margin-top: var(--space-6);
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
}

.auth-footer p {
    margin: 0;
}
</style>



</body></html>

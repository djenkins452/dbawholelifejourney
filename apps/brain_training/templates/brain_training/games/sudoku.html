{% extends "brain_training/games/base_game.html" %}

{% block exercise_css %}
<style>
    .sudoku-board {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 1px;
        background: var(--color-border);
        border: 2px solid var(--color-text);
        max-width: 400px;
        width: 100%;
        aspect-ratio: 1;
        border-radius: var(--radius-md);
        overflow: hidden;
    }

    .sudoku-cell {
        background: var(--color-background);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s;
        position: relative;
    }

    .sudoku-cell.given {
        background: var(--color-surface);
        cursor: default;
        font-weight: 700;
        color: var(--color-text);
    }

    .sudoku-cell.selected {
        background: color-mix(in srgb, var(--color-accent) 20%, transparent);
    }

    .sudoku-cell.same-value {
        background: color-mix(in srgb, var(--color-accent) 10%, transparent);
    }

    .sudoku-cell.error {
        color: #ef4444;
        background: color-mix(in srgb, #ef4444 10%, transparent);
    }

    .sudoku-cell.hint {
        animation: hint-pulse 1s ease-in-out;
    }

    @keyframes hint-pulse {
        0%, 100% { background: var(--color-background); }
        50% { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
    }

    /* Notes/pencil marks display */
    .sudoku-cell .cell-value {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }

    .sudoku-cell .cell-notes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        width: 100%;
        height: 100%;
        padding: 2px;
    }

    .sudoku-cell .cell-notes span {
        font-size: clamp(0.4rem, 1.5vw, 0.6rem);
        color: var(--color-text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Box borders */
    .sudoku-cell:nth-child(3n) {
        border-right: 2px solid var(--color-text);
    }

    .sudoku-cell:nth-child(9n) {
        border-right: none;
    }

    .sudoku-cell:nth-child(n+19):nth-child(-n+27),
    .sudoku-cell:nth-child(n+46):nth-child(-n+54) {
        border-bottom: 2px solid var(--color-text);
    }

    /* Sudoku controls row */
    .sudoku-controls {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-3);
        justify-content: center;
        flex-wrap: wrap;
    }

    .control-btn {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        padding: var(--space-2) var(--space-3);
        font-size: 0.875rem;
        font-weight: 500;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text);
        cursor: pointer;
        transition: all 0.15s;
    }

    .control-btn:hover {
        background: var(--color-border);
    }

    .control-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .control-btn.active {
        background: var(--color-accent);
        color: white;
        border-color: var(--color-accent);
    }

    /* Number pad */
    .number-pad {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: var(--space-2);
        max-width: 400px;
        width: 100%;
        margin-top: var(--space-3);
    }

    .number-btn {
        padding: var(--space-3);
        font-size: 1.25rem;
        font-weight: 600;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text);
        cursor: pointer;
        transition: all 0.15s;
        position: relative;
    }

    .number-btn:hover:not(.completed) {
        background: var(--color-accent);
        color: white;
    }

    .number-btn.completed {
        opacity: 0.3;
        cursor: default;
    }

    .number-btn .count-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        font-size: 0.6rem;
        font-weight: 400;
        color: var(--color-text-muted);
    }

    /* Row/column/box highlighting */
    .sudoku-cell.in-scope {
        background: color-mix(in srgb, var(--color-accent) 8%, var(--color-background));
    }

    .sudoku-cell.in-scope.given {
        background: color-mix(in srgb, var(--color-accent) 8%, var(--color-surface));
    }

    @media (max-width: 480px) {
        .sudoku-board {
            max-width: 100%;
        }

        .number-pad {
            max-width: 100%;
        }

        .number-btn {
            padding: var(--space-2);
            font-size: 1.1rem;
        }

        .control-btn {
            padding: var(--space-2);
            font-size: 0.75rem;
        }

        .control-btn svg {
            width: 16px;
            height: 16px;
        }
    }
</style>
{% endblock %}

{% block exercise_area %}
<div class="sudoku-board" id="sudoku-board">
    <!-- Cells generated by JS -->
</div>
<div class="sudoku-controls">
    <button class="control-btn" id="undo-btn" title="Undo (Ctrl+Z)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10h10a5 5 0 0 1 5 5v2"/>
            <path d="M3 10l4-4"/>
            <path d="M3 10l4 4"/>
        </svg>
        Undo
    </button>
    <button class="control-btn" id="notes-toggle" title="Toggle Notes Mode (N)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Notes
    </button>
    <button class="control-btn" id="erase-btn" title="Erase (Delete)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
        </svg>
        Erase
    </button>
</div>
<div class="number-pad" id="number-pad">
    <button class="number-btn" data-value="1">1</button>
    <button class="number-btn" data-value="2">2</button>
    <button class="number-btn" data-value="3">3</button>
    <button class="number-btn" data-value="4">4</button>
    <button class="number-btn" data-value="5">5</button>
    <button class="number-btn" data-value="6">6</button>
    <button class="number-btn" data-value="7">7</button>
    <button class="number-btn" data-value="8">8</button>
    <button class="number-btn" data-value="9">9</button>
</div>
{% endblock %}

{% block exercise_js %}
<script>
    // Sudoku-specific logic with NY Times-style UX
    const SudokuExercise = Object.assign(Object.create(BrainExercise), {
        puzzleGrid: [],
        userGrid: [],
        notesGrid: [], // 2D array of Sets for pencil marks
        selectedCell: null,
        notesMode: false,
        undoStack: [], // Stack of {row, col, oldValue, oldNotes, newValue, newNotes}
        maxUndoSize: 100,

        init() {
            BrainExercise.init.call(this);
            this.bindSudokuEvents();
        },

        bindSudokuEvents() {
            // Number pad clicks
            document.querySelectorAll('.number-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const value = parseInt(btn.dataset.value, 10);
                    this.enterNumber(value);
                });
            });

            // Notes toggle button
            document.getElementById('notes-toggle').addEventListener('click', () => {
                this.toggleNotesMode();
            });

            // Erase button
            document.getElementById('erase-btn').addEventListener('click', () => {
                this.enterNumber(0);
            });

            // Undo button
            document.getElementById('undo-btn').addEventListener('click', () => {
                this.undo();
            });

            // Keyboard input
            document.addEventListener('keydown', (e) => {
                // Ignore if typing in an input field
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if (e.key >= '1' && e.key <= '9') {
                    this.enterNumber(parseInt(e.key, 10));
                } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
                    e.preventDefault();
                    this.enterNumber(0);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    this.moveSelection(-9);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    this.moveSelection(9);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    this.moveSelection(-1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    this.moveSelection(1);
                } else if (e.key === 'n' || e.key === 'N') {
                    this.toggleNotesMode();
                } else if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    this.undo();
                }
            });
        },

        toggleNotesMode() {
            this.notesMode = !this.notesMode;
            document.getElementById('notes-toggle').classList.toggle('active', this.notesMode);
        },

        renderPuzzle(puzzleData) {
            this.puzzleGrid = puzzleData.grid;
            this.userGrid = JSON.parse(JSON.stringify(puzzleData.grid));
            this.initNotesGrid();
            this.selectedCell = null;
            this.notesMode = false;
            this.undoStack = [];
            document.getElementById('notes-toggle').classList.remove('active');
            this.updateUndoButton();

            this.renderBoard();
            this.updateNumberPad();
        },

        initNotesGrid() {
            this.notesGrid = [];
            for (let r = 0; r < 9; r++) {
                this.notesGrid[r] = [];
                for (let c = 0; c < 9; c++) {
                    this.notesGrid[r][c] = new Set();
                }
            }
        },

        renderBoard() {
            const board = document.getElementById('sudoku-board');
            board.innerHTML = '';

            // Determine highlighting based on selected cell
            const selectedRow = this.selectedCell !== null ? Math.floor(this.selectedCell / 9) : -1;
            const selectedCol = this.selectedCell !== null ? this.selectedCell % 9 : -1;
            const selectedBoxRow = Math.floor(selectedRow / 3) * 3;
            const selectedBoxCol = Math.floor(selectedCol / 3) * 3;

            // Get the value to highlight (from selected cell)
            let highlightValue = 0;
            if (this.selectedCell !== null) {
                highlightValue = this.userGrid[selectedRow][selectedCol];
            }

            for (let i = 0; i < 81; i++) {
                const row = Math.floor(i / 9);
                const col = i % 9;
                const value = this.puzzleGrid[row][col];
                const userValue = this.userGrid[row][col];
                const boxRow = Math.floor(row / 3) * 3;
                const boxCol = Math.floor(col / 3) * 3;

                const cell = document.createElement('div');
                cell.className = 'sudoku-cell';
                cell.dataset.index = i;

                // Row/column/box highlighting (NY Times style)
                if (this.selectedCell !== null) {
                    const inSameRow = row === selectedRow;
                    const inSameCol = col === selectedCol;
                    const inSameBox = boxRow === selectedBoxRow && boxCol === selectedBoxCol;
                    if (inSameRow || inSameCol || inSameBox) {
                        cell.classList.add('in-scope');
                    }
                }

                if (value !== 0) {
                    // Given cell
                    cell.innerHTML = `<span class="cell-value">${value}</span>`;
                    cell.classList.add('given');
                    // Highlight matching numbers
                    if (highlightValue !== 0 && value === highlightValue) {
                        cell.classList.add('same-value');
                    }
                } else if (userValue !== 0) {
                    // User-entered value
                    cell.innerHTML = `<span class="cell-value">${userValue}</span>`;
                    if (this.hasConflict(row, col, userValue)) {
                        cell.classList.add('error');
                    }
                    // Highlight matching numbers
                    if (highlightValue !== 0 && userValue === highlightValue) {
                        cell.classList.add('same-value');
                    }
                } else {
                    // Empty cell - show notes if any
                    const notes = this.notesGrid[row][col];
                    if (notes.size > 0) {
                        cell.innerHTML = this.renderNotes(notes);
                    }
                }

                // Mark selected cell
                if (i === this.selectedCell) {
                    cell.classList.add('selected');
                }

                cell.addEventListener('click', () => this.selectCell(i));
                board.appendChild(cell);
            }
        },

        renderNotes(notes) {
            let html = '<div class="cell-notes">';
            for (let n = 1; n <= 9; n++) {
                html += `<span>${notes.has(n) ? n : ''}</span>`;
            }
            html += '</div>';
            return html;
        },

        selectCell(index) {
            const row = Math.floor(index / 9);
            const col = index % 9;

            // Allow selecting given cells (to highlight matching numbers)
            this.selectedCell = index;

            // Re-render to update all highlighting
            this.renderBoard();
        },

        enterNumber(value) {
            if (this.selectedCell === null) return;

            const row = Math.floor(this.selectedCell / 9);
            const col = this.selectedCell % 9;

            // Can't modify given cells
            if (this.puzzleGrid[row][col] !== 0) return;

            // Save state for undo
            const oldValue = this.userGrid[row][col];
            const oldNotes = new Set(this.notesGrid[row][col]);

            if (this.notesMode && value !== 0) {
                // Toggle note
                const notes = this.notesGrid[row][col];
                if (notes.has(value)) {
                    notes.delete(value);
                } else {
                    notes.add(value);
                }
                // Clear main value when adding notes
                this.userGrid[row][col] = 0;

                // Record undo
                this.pushUndo(row, col, oldValue, oldNotes, 0, new Set(this.notesGrid[row][col]));
            } else {
                // Enter value (or clear with 0)
                this.userGrid[row][col] = value;
                // Clear notes when entering a value
                if (value !== 0) {
                    this.notesGrid[row][col].clear();
                    // Auto-remove this number from notes in same row/col/box
                    this.autoRemoveNotes(row, col, value);
                }

                // Record undo
                this.pushUndo(row, col, oldValue, oldNotes, value, new Set(this.notesGrid[row][col]));
            }

            // Re-render the board
            this.renderBoard();
            this.updateNumberPad();
        },

        // Auto-remove notes from cells in the same row, column, and box
        autoRemoveNotes(row, col, value) {
            // Remove from same row
            for (let c = 0; c < 9; c++) {
                if (c !== col) {
                    this.notesGrid[row][c].delete(value);
                }
            }
            // Remove from same column
            for (let r = 0; r < 9; r++) {
                if (r !== row) {
                    this.notesGrid[r][col].delete(value);
                }
            }
            // Remove from same box
            const boxRow = Math.floor(row / 3) * 3;
            const boxCol = Math.floor(col / 3) * 3;
            for (let r = boxRow; r < boxRow + 3; r++) {
                for (let c = boxCol; c < boxCol + 3; c++) {
                    if (r !== row || c !== col) {
                        this.notesGrid[r][c].delete(value);
                    }
                }
            }
        },

        pushUndo(row, col, oldValue, oldNotes, newValue, newNotes) {
            this.undoStack.push({ row, col, oldValue, oldNotes, newValue, newNotes });
            if (this.undoStack.length > this.maxUndoSize) {
                this.undoStack.shift();
            }
            this.updateUndoButton();
        },

        undo() {
            if (this.undoStack.length === 0) return;

            const action = this.undoStack.pop();
            this.userGrid[action.row][action.col] = action.oldValue;
            this.notesGrid[action.row][action.col] = new Set(action.oldNotes);

            // Select the cell that was undone
            this.selectedCell = action.row * 9 + action.col;

            this.renderBoard();
            this.updateNumberPad();
            this.updateUndoButton();
        },

        updateUndoButton() {
            const btn = document.getElementById('undo-btn');
            btn.disabled = this.undoStack.length === 0;
        },

        // Update number pad to show completion status
        updateNumberPad() {
            const counts = {};
            for (let n = 1; n <= 9; n++) {
                counts[n] = 0;
            }

            // Count occurrences of each number
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const val = this.userGrid[r][c];
                    if (val !== 0) {
                        counts[val]++;
                    }
                }
            }

            // Update number buttons
            document.querySelectorAll('.number-btn').forEach(btn => {
                const value = parseInt(btn.dataset.value, 10);
                const count = counts[value] || 0;
                const isComplete = count >= 9;

                btn.classList.toggle('completed', isComplete);

                // Show count badge if not complete
                let badge = btn.querySelector('.count-badge');
                if (!badge) {
                    badge = document.createElement('span');
                    badge.className = 'count-badge';
                    btn.appendChild(badge);
                }
                badge.textContent = count > 0 && !isComplete ? count : '';
            });
        },

        moveSelection(delta) {
            if (this.selectedCell === null) {
                // Start from first cell if nothing selected
                this.selectCell(0);
                return;
            }

            let newIndex = this.selectedCell + delta;

            // Handle row wrapping for left/right
            if (delta === -1 && this.selectedCell % 9 === 0) return; // At left edge
            if (delta === 1 && this.selectedCell % 9 === 8) return; // At right edge

            // Handle bounds for up/down
            if (newIndex < 0 || newIndex >= 81) return;

            this.selectCell(newIndex);
        },

        hasConflict(row, col, value) {
            // Check row
            for (let c = 0; c < 9; c++) {
                if (c !== col && this.userGrid[row][c] === value) return true;
            }

            // Check column
            for (let r = 0; r < 9; r++) {
                if (r !== row && this.userGrid[r][col] === value) return true;
            }

            // Check box
            const boxRow = Math.floor(row / 3) * 3;
            const boxCol = Math.floor(col / 3) * 3;
            for (let r = boxRow; r < boxRow + 3; r++) {
                for (let c = boxCol; c < boxCol + 3; c++) {
                    if ((r !== row || c !== col) && this.userGrid[r][c] === value) return true;
                }
            }

            return false;
        },

        checkSolution() {
            // Check if grid is complete
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (this.userGrid[r][c] === 0) {
                        alert('Please fill all cells before checking.');
                        return;
                    }
                }
            }

            this.completeSession({ grid: this.userGrid });
        },

        useHint() {
            BrainExercise.useHint.call(this);

            // Find first empty or incorrect cell and highlight it
            for (let i = 0; i < 81; i++) {
                const row = Math.floor(i / 9);
                const col = i % 9;
                const userValue = this.userGrid[row][col];

                // Check for empty cell
                if (this.puzzleGrid[row][col] === 0 && userValue === 0) {
                    const cells = document.querySelectorAll('.sudoku-cell');
                    cells[i].classList.add('hint');
                    setTimeout(() => cells[i].classList.remove('hint'), 1000);
                    this.selectCell(i);
                    return;
                }

                // Check for cell with conflict (incorrect)
                if (this.puzzleGrid[row][col] === 0 && userValue !== 0 && this.hasConflict(row, col, userValue)) {
                    const cells = document.querySelectorAll('.sudoku-cell');
                    cells[i].classList.add('hint');
                    setTimeout(() => cells[i].classList.remove('hint'), 1000);
                    this.selectCell(i);
                    return;
                }
            }
        },

        // Override getState to include notes and undo stack
        getState() {
            // Convert Sets to arrays for JSON serialization
            const notesArray = this.notesGrid.map(row =>
                row.map(cell => Array.from(cell))
            );
            const undoArray = this.undoStack.map(action => ({
                ...action,
                oldNotes: Array.from(action.oldNotes),
                newNotes: Array.from(action.newNotes)
            }));
            return {
                userGrid: this.userGrid,
                notes: notesArray,
                undoStack: undoArray,
            };
        },

        // Override restoreState to restore notes and undo stack
        restoreState(state) {
            if (state.userGrid) {
                this.userGrid = state.userGrid;
            }
            if (state.notes) {
                this.notesGrid = state.notes.map(row =>
                    row.map(cell => new Set(cell))
                );
            }
            if (state.undoStack) {
                this.undoStack = state.undoStack.map(action => ({
                    ...action,
                    oldNotes: new Set(action.oldNotes),
                    newNotes: new Set(action.newNotes)
                }));
            }
            this.renderBoard();
            this.updateNumberPad();
            this.updateUndoButton();
        }
    });

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
        SudokuExercise.init();
    });
</script>
{% endblock %}

        selector:
          strategy: "data-testid"
          value: "life-pet-list"
        expected: "Pets"

  - id: "ORG-PET-003"
    name: "Add Pet button visible"
    priority: "medium"
    tags: ["pets"]
    steps:
      - action: "NAVIGATE"
        url: "/life/pets/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "life-add-pet-button"

  - id: "ORG-PET-004"
    name: "Pets back link returns to organize"
    priority: "medium"
    tags: ["pets", "navigation"]
    steps:
      - action: "NAVIGATE"
        url: "/life/pets/"
      - action: "WAIT"
        timeout_ms: 2000
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "life-back-link"
        timeout_ms: 10000
    asserts:
      - type: "url_contains"
        expected: "/life/"


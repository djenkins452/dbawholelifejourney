# Pre-commit hooks for WLJ.
#
# To enable locally:
#   pip install pre-commit
#   pre-commit install
#
# To run manually against all files:
#   pre-commit run --all-files
#
# Hooks run in CI via .github/workflows/test.yml as well — this file
# provides developer-side fast feedback before the commit lands.

repos:
  - repo: local
    hooks:
      # Catches invalid JavaScript inside <script> blocks in Django
      # templates. See scripts/check_template_js.py for rationale — this
      # exists because commit 39c7d54e silently broke the scan page for
      # 11 days by corrupting a single JS string literal.
      #
      # Requires `node` on PATH. If node is missing the hook returns
      # exit code 2 and prints an install hint, rather than hiding the
      # failure.
      - id: check-template-js
        name: Validate JS syntax in Django templates
        entry: python3 scripts/check_template_js.py
        language: system
        # Only run when template files change. Pre-commit passes matched
        # file paths as positional args, which the script accepts.
        files: ^templates/.*\.html$
        # We pass the matched files explicitly (pass_filenames: true is
        # the default), so edits to one template don't rescan the world.
        pass_filenames: true
        # Quiet mode — don't spam stdout on success, only print on failure.
        args: ["--quiet"]

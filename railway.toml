[build]
builder = "nixpacks"

# No [deploy] section — each Railway service defines its own Custom Start Command:
#
# Web Service:
#   python manage.py migrate --noinput && \
#   python manage.py load_initial_data -v 0 && \
#   python manage.py recalculate_task_priorities -v 0 && \
#   python manage.py collectstatic --noinput && \
#   gunicorn config.wsgi --preload --log-file - --timeout 300
#
# Worker Service (dbawholelifejourney):
#   celery -A config worker --loglevel=info --concurrency=2
#
# Note: Celery Beat is not yet deployed as a separate service.
# SAME monitoring requires Beat to dispatch run_same_cycle_task every 60s.

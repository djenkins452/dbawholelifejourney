<div class="v2-action-row" id="med-group-{{ group.time_of_day }}">
    <button class="v2-action-toggle {% if group.all_taken %}v2-completed{% endif %}"
            hx-post="{% url 'dashboard_v2:medicine_group_log' time_of_day=group.time_of_day %}"
            hx-target="#medicine-card"
            hx-swap="outerHTML">
        {% if group.all_taken %}
            <span class="v2-check">&#10003;</span>
        {% else %}
            <span class="v2-check-empty">&#9675;</span>
        {% endif %}
    </button>
    <div class="v2-action-content">
        <a href="{% url 'health:medicine_home' %}" class="v2-action-title-link {% if group.all_taken %}v2-strikethrough{% endif %}">
            {{ group.label }}
        </a>
        <span class="v2-action-detail">{{ group.taken_count }}/{{ group.total_count }} meds</span>
    </div>
</div>

{% comment %}
Confidence Meter Partial
Displays a visual confidence bar with percentage.

Expected context:
  confidence — Decimal 0.0 to 1.0
  label — Optional label text
{% endcomment %}
<div class="confidence-meter" title="Confidence: {{ confidence|floatformat:0 }}%">
    {% if label %}<span class="confidence-label">{{ label }}</span>{% endif %}
    <div class="confidence-bar">
        <div class="confidence-fill{% if confidence >= 0.8 %} confidence-high{% elif confidence >= 0.5 %} confidence-medium{% else %} confidence-low{% endif %}"
             style="width: {{ confidence|floatformat:0 }}%"></div>
    </div>
    <span class="confidence-value">{{ confidence|floatformat:0 }}%</span>
</div>

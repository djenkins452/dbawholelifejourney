<div class="v2-celebration-overlay">
    <div class="v2-celebration-card">
        <div class="v2-celebration-header">
            <span class="v2-celebration-sparkle">&#10024;</span>
            <h2 class="v2-celebration-headline">{{ celebration.headline }}</h2>
        </div>
        <p class="v2-celebration-narrative">{{ celebration.narrative }}</p>
        {% if celebration.domain %}
        <span class="v2-celebration-domain">{{ celebration.get_celebration_type_display }}</span>
        {% endif %}
        <div class="v2-celebration-actions">
            <button class="v2-btn v2-btn-primary"
                    data-action="dismiss-celebration"
                    data-celebration-id="{{ celebration.pk }}">
                Continue
            </button>
        </div>
    </div>
</div>

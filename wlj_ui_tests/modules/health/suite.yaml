version: "1.0"
suite: "Health Module Tests"
module: "health"

auth:
  strategy: "session"
  username: "${TEST_USERNAME}"
  password: "${TEST_PASSWORD}"
  login_url: "/accounts/login/"

defaults:
  timeout_ms: 5000
  base_url: "${BASE_URL}"
  screenshot_on_failure: true
  html_dump_on_failure: true

cases:

  # ============================================================
  # AUTH
  # ============================================================

  - id: "HEALTH-AUTH-001"
    name: "Login and navigate to health landing"
    priority: "high"
    tags: ["smoke", "auth"]
    steps:
      - action: "NAVIGATE"
        url: "/accounts/logout/"
      - action: "NAVIGATE"
        url: "/accounts/login/"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-email-input"
        input: "${TEST_USERNAME}"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-password-input"
        input: "${TEST_PASSWORD}"
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "login-submit-button"
        timeout_ms: 10000
      - action: "WAIT"
        timeout_ms: 3000
    asserts:
      - type: "url_contains"
        expected: "/dashboard/"

  # ============================================================
  # LANDING PAGE
  # ============================================================

  - id: "HEALTH-LANDING-001"
    name: "Landing page loads with correct structure"
    priority: "high"
    tags: ["landing", "smoke"]
    steps:
      - action: "NAVIGATE"
        url: "/health/"
    asserts:
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "health-landing"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "health-landing"
        expected: "Health"

  - id: "HEALTH-LANDING-002"
    name: "Physical Health tile is visible"
    priority: "high"
    tags: ["landing"]
    steps:
      - action: "NAVIGATE"
        url: "/health/"
    asserts:
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "health-landing"
        expected: "Physical Health"

  - id: "HEALTH-LANDING-003"
    name: "Cognitive Health tile is visible"
    priority: "medium"
    tags: ["landing"]
    steps:
      - action: "NAVIGATE"
        url: "/health/"
    asserts:
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "health-landing"
        expected: "Cognitive Health"

  # ============================================================
  # PHYSICAL HEALTH HOME
  # ============================================================

  - id: "HEALTH-HOME-001"
    name: "Navigate to Physical Health home"
    priority: "high"
    tags: ["home", "smoke"]
    steps:
      - action: "NAVIGATE"
        url: "/health/physical/"
    asserts:
      - type: "url_contains"
        expected: "/health/physical/"
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "health-home"

  - id: "HEALTH-HOME-002"
    name: "Health home has breadcrumb back to landing"
    priority: "medium"
    tags: ["home", "nav"]
    steps:
      - action: "NAVIGATE"
        url: "/health/physical/"
    asserts:
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "health-back-link"

  - id: "HEALTH-HOME-003"

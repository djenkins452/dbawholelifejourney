version: "1.0"
suite: "Journal Module Tests"
module: "journal"

auth:
  strategy: "session"
  username: "${TEST_USERNAME}"
  password: "${TEST_PASSWORD}"
  login_url: "/accounts/login/"

defaults:
  timeout_ms: 5000
  base_url: "${BASE_URL}"
  screenshot_on_failure: true
  html_dump_on_failure: true

cases:
  - id: "JRN-001"
    name: "Login to application"
    priority: "high"
    tags: ["smoke", "auth"]
    steps:
      - action: "NAVIGATE"
        url: "/accounts/logout/"
      - action: "NAVIGATE"
        url: "/accounts/login/"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-email-input"
        input: "${TEST_USERNAME}"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-password-input"
        input: "${TEST_PASSWORD}"
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "login-submit-button"
      - action: "WAIT"
        timeout_ms: 3000
    asserts:
      - type: "url_contains"
        expected: "/dashboard/"
      - type: "element_not_visible"
        selector:
          strategy: "data-testid"
          value: "login-form"

  - id: "JRN-002"
    name: "Create a new journal entry"
    priority: "high"
    tags: ["smoke", "crud"]
    steps:
      - action: "NAVIGATE"
        url: "/journal/new/"
      - action: "WAIT"
        timeout_ms: 2000
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "journal-entry-title-input"
        input: "AUTOTEST|journal|${RUN_ID}|Smoke Test Entry"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "journal-entry-body-textarea"
        input: "This is an automated test entry created by the WLJ UI test framework. It should be cleaned up after the test run completes."
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "journal-entry-save-button"
      - action: "WAIT"
        timeout_ms: 3000
    asserts:
      - type: "url_contains"
        expected: "/journal/"
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "journal-entry-list"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "journal-entry-list"
        expected: "AUTOTEST|journal|${RUN_ID}|Smoke Test Entry"

  - id: "JRN-003"
    name: "Verify entry appears in entry list"
    priority: "high"
    tags: ["smoke", "crud"]
    steps:
      - action: "NAVIGATE"
        url: "/journal/entries/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "journal-entry-list"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "journal-entry-list"
        expected: "AUTOTEST|journal|${RUN_ID}|Smoke Test Entry"

  - id: "JRN-004"
    name: "Cleanup AUTOTEST journal entries for this run"
    priority: "high"
    tags: ["cleanup"]
    cleanup_scope: "AUTOTEST|journal|${RUN_ID}|"
    steps:
      - action: "NAVIGATE"
        url: "/journal/entries/?search=AUTOTEST%7Cjournal%7C${RUN_ID}%7C"
        description: "Search entry list filtered to this RUN_ID"
      - action: "WAIT"
        timeout_ms: 2000
    cleanup:
      - action: "CLICK"
        selector:
          strategy: "text_contains"
          value: "AUTOTEST|journal|${RUN_ID}|"
        description: "Click the AUTOTEST entry scoped to this RUN_ID"
      - action: "WAIT"
        timeout_ms: 1000
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "journal-entry-delete-button"
        description: "Soft-delete the AUTOTEST entry"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "url_contains"
        expected: "/journal/"

      - type: "element_visible"
        selector:
          strategy: "id"
          value: "id_value"
      - type: "element_visible"
        selector:
          strategy: "id"
          value: "id_unit"
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "weight-save-button"
      - type: "element_visible"
        selector:
          strategy: "data-testid"

version: "1.0"
suite: "Organize Module Tests"
module: "organize"

auth:
  strategy: "session"
  username: "${TEST_USERNAME}"
  password: "${TEST_PASSWORD}"
  login_url: "/accounts/login/"

defaults:
  timeout_ms: 5000
  base_url: "${BASE_URL}"
  screenshot_on_failure: true
  html_dump_on_failure: true

cases:

  # ============================================================
  # AUTH
  # ============================================================

  - id: "ORG-AUTH-001"
    name: "Login and navigate to organize"
    priority: "high"
    tags: ["auth", "smoke"]
    steps:
      - action: "NAVIGATE"
        url: "/accounts/logout/"
      - action: "NAVIGATE"
        url: "/accounts/login/"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-email-input"
        input: "${TEST_USERNAME}"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-password-input"
        input: "${TEST_PASSWORD}"
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "login-submit-button"
        timeout_ms: 10000
      - action: "WAIT"
        timeout_ms: 3000
    asserts:
      - type: "url_contains"
        expected: "/dashboard/"

  # ============================================================
  # PETS
  # ============================================================

  - id: "ORG-PET-001"
    name: "Pets list page loads"
    priority: "high"
    tags: ["pets", "smoke"]
    steps:
      - action: "NAVIGATE"
        url: "/life/pets/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "url_contains"
        expected: "/life/pets/"
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "life-pet-list"

  - id: "ORG-PET-002"
    name: "Pets shows title"
    priority: "medium"
    tags: ["pets"]
    steps:
      - action: "NAVIGATE"
        url: "/life/pets/"

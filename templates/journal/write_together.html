{% extends "base.html" %}

{% block title %}Write Together - Whole Life Journey{% endblock %}

{% block content %}
<div class="wt" data-voice="{% if request.GET.voice %}1{% endif %}">

    <div class="wt-topbar">
        <a href="{% url 'journal:entry_list' %}" class="wt-back" aria-label="Back to Journal">
            <span aria-hidden="true">←</span> Journal
        </a>
        <span class="wt-title">Write Together</span>
    </div>

    <div id="wt-thread" class="wt-thread" aria-live="polite">
        {% for t in turns %}
            <div class="wt-turn {{ t.role }}">
                <div class="wt-who">{% if t.role == 'assistant' %}Chief of Staff{% else %}You{% endif %}</div>
                <div class="wt-text">{{ t.text }}</div>
            </div>
        {% endfor %}
    </div>

    <div class="wt-footer">
        <div id="wt-voicebar" class="wt-voicebar" hidden aria-live="polite">
            <span id="wt-voicestate" class="wt-voicestate"></span>
            <button type="button" id="wt-interrupt" class="wt-interrupt" hidden>Tap to talk</button>
        </div>
        <form id="wt-composer" class="wt-composer" autocomplete="off">
            {% csrf_token %}
            <button type="button" id="wt-mic" class="wt-mic" aria-label="Talk it through" title="Talk it through" hidden>
                <span aria-hidden="true">🎙</span>
            </button>
            <textarea id="wt-input" class="wt-input" rows="1"
                      placeholder="Tell me about your day…" aria-label="Your message"></textarea>
            <button type="submit" id="wt-send" class="wt-send" aria-label="Send">
                <span aria-hidden="true">↑</span>
            </button>
        </form>
        <div class="wt-finish">
            <span id="wt-notice" class="wt-notice" hidden></span>
            <button type="button" id="wt-generate" class="wt-generate">When you're ready — create today's journal</button>
        </div>
    </div>

</div>

<style nonce="{{ csp_nonce }}">
.wt {
    max-width: 640px;
    margin: 0 auto;
    padding: var(--space-5) var(--space-4) 0;
    display: flex;
    flex-direction: column;
    /* Height is set precisely by JS to fill the visible area (iMessage model):
       the thread scrolls internally and the composer stays anchored below it.
       This calc() is only a pre-JS fallback. */
    height: calc(100vh - 140px);
}
.wt-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5); }
.wt-back { color: var(--color-text-muted); text-decoration: none; font-size: var(--font-size-sm); transition: color var(--transition-fast); }
.wt-back:hover { color: var(--color-text); }
.wt-title { font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-muted); }

/* The conversation — a written dialogue, not a chat window (no avatars, no bubbles) */
.wt-thread {
    flex: 1;
    min-height: 0;              /* critical: lets the flex child actually scroll */
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
    padding: var(--space-1) 0 var(--space-4);
    overscroll-behavior: contain;
}
.wt-who {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-muted); margin-bottom: var(--space-1);
}
.wt-turn.assistant .wt-who { color: var(--color-accent); }
.wt-turn.assistant .wt-text {
    font-family: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: 1.18rem; line-height: 1.6; color: var(--color-text);
}
.wt-turn.user { align-self: flex-end; max-width: 88%; text-align: left; }
.wt-turn.user .wt-who { text-align: right; }
.wt-turn.user .wt-text {
    background: color-mix(in srgb, var(--color-accent) 8%, var(--color-surface));
    border: 1px solid color-mix(in srgb, var(--color-accent) 16%, var(--color-border));
    border-radius: 14px;
    padding: var(--space-3) var(--space-4);
    font-size: 1rem; line-height: 1.55; color: var(--color-text);
    white-space: pre-wrap;
}
.wt-thinking .wt-text.wt-dots {
    color: var(--color-text-muted); font-family: inherit; font-size: 1.1rem;
    animation: wt-pulse 1.2s ease-in-out infinite;
}
@keyframes wt-pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* Composer — anchored below the scrolling thread (never overlaps messages) */
.wt-footer { flex-shrink: 0; background: var(--color-bg); padding: var(--space-3) 0 var(--space-4); }
.wt-composer {
    display: flex; align-items: flex-end; gap: var(--space-2);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 20px;
    padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
}
.wt-composer:focus-within { border-color: var(--color-accent); }
.wt-input {
    flex: 1; border: none; background: transparent; resize: none;
    font-size: 1rem; line-height: 1.5; color: var(--color-text);
    max-height: 160px; padding: var(--space-2) 0;
}
.wt-input:focus { outline: none; }
.wt-send {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    border: none; background: var(--color-accent); color: #fff;
    font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity var(--transition-fast);
}
.wt-send:disabled { opacity: 0.5; cursor: default; }

/* Voice (Talk It Through) — same conversation, spoken. Calm, minimal state. */
.wt-mic {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted);
    font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all var(--transition-fast);
}
.wt-mic:hover { color: var(--color-text); border-color: var(--color-accent); }
.wt-mic.is-on { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
.wt-voicebar {
    display: flex; align-items: center; justify-content: center; gap: var(--space-3);
    padding-bottom: var(--space-2); min-height: 22px;
}
.wt-voicestate { font-size: var(--font-size-sm); color: var(--color-text-muted); }
.wt-voicestate.is-listening { color: var(--color-accent); }
.wt-voicestate.is-listening::before {
    content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--color-accent); margin-right: var(--space-2); vertical-align: middle;
    animation: wt-pulse 1.2s ease-in-out infinite;
}
.wt-interrupt {
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted);
    font-size: var(--font-size-xs); padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); cursor: pointer;
}
.wt-interrupt:hover { color: var(--color-accent); border-color: var(--color-accent); }
.wt-finish { display: flex; align-items: center; justify-content: center; gap: var(--space-3); margin-top: var(--space-3); }
.wt-notice { font-size: var(--font-size-sm); color: var(--color-text-muted); }
.wt-generate {
    background: none; border: none; cursor: pointer;
    color: var(--color-text-muted); font-size: var(--font-size-sm);
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-full);
    transition: all var(--transition-fast);
}
.wt-generate:hover { color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 8%, transparent); }
.wt-generate:disabled { opacity: 0.6; cursor: default; }

@media (max-width: 640px) {
    .wt { padding: var(--space-4) var(--space-3) var(--space-3); }
    .wt-turn.assistant .wt-text { font-size: 1.1rem; }
}
</style>

<script nonce="{{ csp_nonce }}">
document.addEventListener('DOMContentLoaded', function() {
    const thread = document.getElementById('wt-thread');
    const form = document.getElementById('wt-composer');
    const input = document.getElementById('wt-input');
    const sendBtn = document.getElementById('wt-send');
    const genBtn = document.getElementById('wt-generate');
    const notice = document.getElementById('wt-notice');
    const csrfEl = form.querySelector('[name=csrfmiddlewaretoken]');
    const csrf = csrfEl ? csrfEl.value : '';
    const MSG_URL = '{% url "journal:write_together_message" %}';
    const GEN_URL = '{% url "journal:write_together_generate" %}';
    const wt = document.querySelector('.wt');

    // iMessage model: size the conversation to fill the visible area so the thread
    // scrolls internally and the composer stays anchored — never overlapping it.
    function bottomInset() {
        const bar = document.querySelector('.bottom-tab-bar');
        if (bar) {
            const cs = getComputedStyle(bar);
            if (cs.display !== 'none' && cs.visibility !== 'hidden') {
                const overlap = window.innerHeight - bar.getBoundingClientRect().top;
                if (overlap > 0) return overlap;
            }
        }
        return 0;
    }
    function sizeWt() {
        if (!wt) return;
        const top = wt.getBoundingClientRect().top;
        wt.style.height = Math.max(320, window.innerHeight - top - bottomInset()) + 'px';
    }
    function nearBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 120; }
    function scrollToBottom() { thread.scrollTop = thread.scrollHeight; }
    window.addEventListener('resize', sizeWt);
    sizeWt();

    // ── Voice (Talk It Through): the SAME conversation, spoken. STT feeds the
    // existing text turn; the reply text is spoken. No backend change. ─────────
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const voiceSupported = !!SR;
    const ttsSupported = ('speechSynthesis' in window);
    const mic = document.getElementById('wt-mic');
    const voicebar = document.getElementById('wt-voicebar');
    const voiceStateEl = document.getElementById('wt-voicestate');
    const interruptBtn = document.getElementById('wt-interrupt');
    let voiceMode = false;
    let recognition = null;
    let wantListening = false;
    let vstate = 'idle';  // idle | listening | thinking | speaking

    function setVState(s) {
        vstate = s;
        if (!voicebar) return;
        voicebar.hidden = !voiceMode;
        if (interruptBtn) interruptBtn.hidden = !(voiceMode && s === 'speaking');
        if (!voiceStateEl) return;
        voiceStateEl.className = 'wt-voicestate';
        if (s === 'listening') { voiceStateEl.textContent = 'Listening'; voiceStateEl.className += ' is-listening'; }
        else if (s === 'thinking') { voiceStateEl.textContent = '· · ·'; }
        else if (s === 'speaking') { voiceStateEl.textContent = 'Chief of Staff is speaking'; }
        else { voiceStateEl.textContent = ''; }
    }
    function announce(msg) { if (notice) { notice.textContent = msg; notice.hidden = false; } }

    function initRecognition() {
        recognition = new SR();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        recognition.onresult = function(e) {
            let interim = '', finalText = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
                const tr = e.results[i][0].transcript;
                if (e.results[i].isFinal) finalText += tr; else interim += tr;
            }
            if (interim && !finalText) { input.value = interim; autoresize(); }
            if (finalText.trim()) { input.value = ''; autoresize(); onUserSpeech(finalText.trim()); }
        };
        recognition.onend = function() {
            if (voiceMode && wantListening && vstate === 'listening') {
                try { recognition.start(); } catch (_) {}
            }
        };
        recognition.onerror = function(ev) {
            if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
                stopVoice();
                announce("Microphone access is off — you can still type.");
            }
        };
    }
    function startListening() {
        if (!voiceMode) return;
        if (!recognition) initRecognition();
        wantListening = true;
        setVState('listening');
        try { recognition.start(); } catch (_) {}
    }
    function onUserSpeech(text) {
        wantListening = false;
        if (recognition) { try { recognition.stop(); } catch (_) {} }
        setVState('thinking');
        sendMessage(text);
    }
    function speak(text) {
        if (!ttsSupported || !voiceMode) { if (voiceMode) startListening(); return; }
        try { window.speechSynthesis.cancel(); } catch (_) {}
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.0;
        u.onend = function() { if (voiceMode) startListening(); };
        u.onerror = function() { if (voiceMode) startListening(); };
        setVState('speaking');
        try { window.speechSynthesis.speak(u); } catch (_) { if (voiceMode) startListening(); }
    }
    function enterVoiceMode() {
        if (!voiceSupported) { announce("Voice isn't available in this browser — you can still type."); return false; }
        voiceMode = true;
        setVState('idle');
        return true;
    }
    function stopVoice() {
        voiceMode = false; wantListening = false; vstate = 'idle';
        if (recognition) { try { recognition.abort(); } catch (_) {} }
        if (ttsSupported) { try { window.speechSynthesis.cancel(); } catch (_) {} }
        if (mic) mic.classList.remove('is-on');
        if (voiceStateEl) { voiceStateEl.textContent = ''; voiceStateEl.className = 'wt-voicestate'; }
        if (interruptBtn) interruptBtn.hidden = true;
        if (voicebar) voicebar.hidden = true;
    }

    if (mic && voiceSupported) mic.hidden = false;
    if (mic) mic.addEventListener('click', function() {
        if (voiceMode) { stopVoice(); }
        else if (enterVoiceMode()) { mic.classList.add('is-on'); if (vstate !== 'speaking' && vstate !== 'thinking') startListening(); }
    });
    if (interruptBtn) interruptBtn.addEventListener('click', function() {
        if (ttsSupported) { try { window.speechSynthesis.cancel(); } catch (_) {} }
        startListening();  // barge-in: let the user talk now
    });

    function addTurn(role, text) {
        const el = document.createElement('div');
        el.className = 'wt-turn ' + role;
        const who = document.createElement('div');
        who.className = 'wt-who';
        who.textContent = (role === 'assistant') ? 'Chief of Staff' : 'You';
        const body = document.createElement('div');
        body.className = 'wt-text';
        body.textContent = text;
        el.appendChild(who); el.appendChild(body);
        thread.appendChild(el);
        return el;
    }

    function addThinking() {
        const el = document.createElement('div');
        el.className = 'wt-turn assistant wt-thinking';
        el.innerHTML = '<div class="wt-who">Chief of Staff</div><div class="wt-text wt-dots">…</div>';
        thread.appendChild(el);
        return el;
    }

    function postJSON(url, body) {
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
            body: JSON.stringify(body || {})
        }).then(function(r) { return r.json(); });
    }

    function autoresize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    }

    function sendMessage(text) {
        addTurn('user', text);
        input.value = ''; autoresize();
        scrollToBottom();               // the user's own message: always follow to it
        sendBtn.disabled = true;
        const thinking = addThinking();
        scrollToBottom();
        postJSON(MSG_URL, { message: text }).then(function(data) {
            const stick = nearBottom();  // don't yank the user down if they scrolled up
            thinking.remove();
            const reply = (data && data.reply) ? data.reply : '';
            if (reply) addTurn('assistant', reply);
            if (stick) scrollToBottom();
            sendBtn.disabled = false;
            if (voiceMode && reply) { speak(reply); }   // voice: CoS speaks, then resumes listening
            else if (!voiceMode) { input.focus(); }
        }).catch(function() {
            thinking.remove();
            addTurn('assistant', "I'm here — tell me more.");
            scrollToBottom();
            sendBtn.disabled = false;
            if (voiceMode) startListening();
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const t = input.value.trim();
        if (t) sendMessage(t);
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const t = input.value.trim();
            if (t) sendMessage(t);
        }
    });
    input.addEventListener('input', autoresize);

    genBtn.addEventListener('click', function() {
        const wasVoice = voiceMode;
        stopVoice();
        genBtn.disabled = true;
        genBtn.textContent = 'Writing your journal…';
        if (notice) notice.hidden = true;
        let done = false;
        function doGenerate() {
            if (done) return; done = true;
            postJSON(GEN_URL, {}).then(function(data) {
                if (data && data.redirect) { window.location.href = data.redirect; return; }
                genBtn.disabled = false;
                genBtn.textContent = "When you're ready — create today's journal";
                if (data && data.message && notice) { notice.textContent = data.message; notice.hidden = false; }
            }).catch(function() {
                genBtn.disabled = false;
                genBtn.textContent = "When you're ready — create today's journal";
            });
        }
        // In voice, the Chief of Staff confirms out loud, then we generate.
        if (wasVoice && ttsSupported) {
            try { window.speechSynthesis.cancel(); } catch (_) {}
            const u = new SpeechSynthesisUtterance("I've got it. Give me a moment to turn our conversation into today's journal.");
            u.onend = doGenerate; u.onerror = doGenerate;
            try { window.speechSynthesis.speak(u); } catch (_) { doGenerate(); }
            setTimeout(doGenerate, 4500);  // safety: never wait indefinitely on TTS
        } else {
            doGenerate();
        }
    });

    // Auto-enter voice mode when arriving via "Talk It Through" (?voice=1).
    const autoVoice = voiceSupported && wt && wt.getAttribute('data-voice') === '1';
    if (autoVoice) { enterVoiceMode(); if (mic) mic.classList.add('is-on'); }

    // Opening: if the conversation hasn't started, fetch the CoS's opening.
    if (thread.children.length === 0) {
        const thinking = addThinking();
        scrollToBottom();
        postJSON(MSG_URL, { message: '' }).then(function(data) {
            thinking.remove();
            const reply = (data && data.reply) ? data.reply : '';
            if (reply) addTurn('assistant', reply);
            scrollToBottom();
            if (voiceMode && reply) { speak(reply); }   // speak the opening, then listen
            else if (!voiceMode) { input.focus(); }
        }).catch(function() {
            thinking.remove();
            addTurn('assistant', "I'm here. What's on your mind?");
            scrollToBottom();
            if (voiceMode) startListening();
        });
    } else {
        scrollToBottom();
        if (voiceMode) startListening();
        else input.focus();
    }
});
</script>
{% endblock %}

<div class="v2-action-row {% if task.is_next %}v2-next-item{% endif %}" id="routine-row-{{ task.pk }}">
    <button class="v2-action-toggle {% if task.is_completed %}v2-completed{% endif %}"
            hx-post="{% url 'dashboard_v2:routine_complete' pk=task.pk %}"
            hx-target="#routine-card"
            hx-swap="outerHTML">
        {% if task.is_completed %}
            <span class="v2-check">&#10003;</span>
        {% else %}
            <span class="v2-check-empty">&#9675;</span>
        {% endif %}
    </button>
    <div class="v2-action-content">
        <a href="{{ task.detail_url }}" class="v2-action-title-link">
            {% if task.is_next %}<strong>Next:</strong> {% endif %}{{ task.title }}
        </a>
        {% if task.scheduled_time %}
            <span class="v2-action-detail">{{ task.scheduled_time|time:"g:i A" }}</span>
        {% endif %}
        {% if task.goal_name %}
            <span class="v2-goal-tag">{{ task.goal_name }}</span>
        {% endif %}
    </div>
    {% if task.engagement_level %}
    <div class="v2-engagement v2-engagement-{{ task.engagement_level }}" title="Engagement: {{ task.engagement_level }}">
        <span class="v2-bar"></span><span class="v2-bar"></span><span class="v2-bar"></span><span class="v2-bar"></span><span class="v2-bar"></span>
    </div>
    {% endif %}
</div>

{% extends "base.html" %}
{% load static %}

{% block title %}Calendar{% endblock %}

{% block extra_css %}
<style nonce="{{ csp_nonce }}">
/* ============================================================
   WLJ Calendar — a familiar calendar (Day/Week/Month/Agenda).
   Standard layout everyone already knows; the richness is that
   every WLJ domain is projected onto it. Reveal, never invent.
   ============================================================ */
.wcal{ --wl:#e4e1d8; --wl2:#efece4; --wink:#23201a; --wmut:#7c766a; --wfaint:#a8a294;
  --wtoday:#c0872b; --wsurface:#ffffff; --wbg:var(--color-bg,#f6f5f0);
  color:var(--wink); font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif; }

/* Toolbar */
.wcal-bar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 16px; background:var(--wbg); border-bottom:1px solid var(--wl); }
.wcal-title{ font-size:19px; font-weight:650; letter-spacing:-.01em; min-width:190px; }
.wcal-nav{ display:inline-flex; align-items:center; gap:2px; }
.wcal-nav button{ appearance:none; border:1px solid var(--wl); background:var(--wsurface); color:var(--wink);
  height:32px; min-width:32px; padding:0 10px; cursor:pointer; font:inherit; font-size:13px; }
.wcal-nav button:first-child{ border-radius:8px 0 0 8px; } .wcal-nav button:last-child{ border-radius:0 8px 8px 0; }
.wcal-nav button:hover{ background:var(--wl2); }
.wcal-tabs{ margin-left:auto; display:inline-flex; border:1px solid var(--wl); border-radius:9px; overflow:hidden; }
.wcal-tabs button{ appearance:none; border:none; background:var(--wsurface); color:var(--wmut); font:inherit;
  font-size:13px; padding:7px 14px; cursor:pointer; }
.wcal-tabs button.on{ background:var(--wink); color:#fff; font-weight:600; }

.wcal-body{ padding:0; }
.wcal-loading{ padding:48px; text-align:center; color:var(--wfaint); }

/* Time-grid (Day + Week share this) */
.wcal-allday{ display:flex; border-bottom:1px solid var(--wl); min-height:34px; }
.wcal-allday .wcal-rail{ flex:none; width:56px; border-right:1px solid var(--wl); font-size:10px; color:var(--wfaint);
  text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; justify-content:center; }
.wcal-allday-cells{ flex:1; display:flex; }
.wcal-allday-cell{ flex:1; min-width:0; padding:4px 5px; display:flex; flex-direction:column; gap:3px; border-left:1px solid var(--wl2); }
.wcal-allday-cell:first-child{ border-left:none; }
.wcal-chip{ font-size:11.5px; padding:2px 7px; border-radius:5px; color:#fff; cursor:pointer; overflow:hidden;
  white-space:nowrap; text-overflow:ellipsis; }

.wcal-scroll{ overflow-y:auto; max-height:calc(100vh - 220px); }
.wcal-tg{ display:flex; position:relative; }
.wcal-rail{ flex:none; width:56px; }
.wcal-rail .wcal-hr{ height:44px; position:relative; }
.wcal-rail .wcal-hr span{ position:absolute; right:8px; top:-7px; font-size:10.5px; color:var(--wfaint); font-variant-numeric:tabular-nums; }
.wcal-cols{ flex:1; display:flex; position:relative;
  background:repeating-linear-gradient(to bottom, transparent, transparent 43px, var(--wl2) 43px, var(--wl2) 44px); }
.wcal-col{ flex:1; min-width:0; position:relative; border-left:1px solid var(--wl2); }
.wcal-col:first-child{ border-left:none; }
.wcal-ev{ position:absolute; border-radius:6px; padding:2px 6px; overflow:hidden; cursor:pointer;
  border-left:3px solid var(--ec,#79839a); background:var(--eb,rgba(121,131,154,.12)); box-sizing:border-box; }
.wcal-ev .et{ font-size:12px; font-weight:600; color:var(--wink); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wcal-ev .em{ font-size:10.5px; color:var(--wmut); font-variant-numeric:tabular-nums; }
.wcal-avail{ position:absolute; left:0; right:0; background:rgba(120,120,120,.06); border-top:1px dashed var(--wl); border-bottom:1px dashed var(--wl); z-index:0; }
.wcal-avail .al{ position:absolute; left:6px; top:4px; font-size:10px; color:var(--wfaint); text-transform:uppercase; letter-spacing:.05em; }
.wcal-now{ position:absolute; left:0; right:0; height:2px; background:#e0342b; z-index:6; }
.wcal-now::before{ content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:#e0342b; }

/* Week headers */
.wcal-weekhead{ display:flex; border-bottom:1px solid var(--wl); }
.wcal-weekhead .wcal-rail{ flex:none; width:56px; border-right:1px solid var(--wl); }
.wcal-weekhead-cells{ flex:1; display:flex; }
.wcal-dh{ flex:1; text-align:center; padding:6px 2px; border-left:1px solid var(--wl2); font-size:12px; color:var(--wmut); }
.wcal-dh:first-child{ border-left:none; }
.wcal-dh b{ display:block; font-size:18px; color:var(--wink); font-weight:650; margin-top:1px; }
.wcal-dh.today b{ color:#fff; background:var(--wtoday); width:30px; height:30px; line-height:30px; border-radius:50%; margin:1px auto 0; }

/* Month */
.wcal-month{ padding:0 0 20px; }
.wcal-mhead{ display:grid; grid-template-columns:repeat(7,1fr); }
.wcal-mhead div{ padding:8px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--wfaint); border-bottom:1px solid var(--wl); }
.wcal-mgrid{ display:grid; grid-template-columns:repeat(7,1fr); }
.wcal-mc{ min-height:104px; border-right:1px solid var(--wl2); border-bottom:1px solid var(--wl2); padding:5px 6px; cursor:pointer; overflow:hidden; }
.wcal-mc.out{ background:rgba(0,0,0,.015); }
.wcal-mc .md{ font-size:12.5px; color:var(--wink); font-variant-numeric:tabular-nums; }
.wcal-mc.today .md{ background:var(--wtoday); color:#fff; width:23px; height:23px; line-height:23px; text-align:center; border-radius:50%; font-weight:700; }
.wcal-mc .mchip{ font-size:11px; margin-top:3px; padding:1px 6px; border-radius:4px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.wcal-mc .mmore{ font-size:10.5px; color:var(--wmut); margin-top:2px; }

/* Agenda */
.wcal-ag{ padding:8px 16px 40px; }
.wcal-agday{ display:flex; align-items:baseline; gap:12px; margin:18px 0 4px; }
.wcal-agday .d1{ font-size:15px; font-weight:650; } .wcal-agday .d2{ font-size:12.5px; color:var(--wfaint); }
.wcal-agrow{ display:flex; gap:14px; align-items:baseline; padding:8px 0; border-top:1px solid var(--wl2); cursor:pointer; }
.wcal-agrow .at{ width:120px; flex:none; font-size:13px; color:var(--wmut); font-variant-numeric:tabular-nums; }
.wcal-agrow .adot{ width:9px; height:9px; border-radius:50%; flex:none; align-self:center; }
.wcal-agrow .an{ font-size:14.5px; color:var(--wink); }
.wcal-empty{ padding:40px 16px; text-align:center; color:var(--wfaint); font-size:14px; }

/* Same-time grouping in the Day grid: show the time once, stack items under it */
.wcal-evgroup{ position:absolute; border-radius:7px; padding:3px 6px 4px; overflow:hidden; box-sizing:border-box;
  border-left:3px solid var(--ec,#79839a); background:var(--eb,rgba(121,131,154,.10)); }
.wcal-evgroup .wcal-gtime{ font-size:10.5px; color:var(--wmut); font-variant-numeric:tabular-nums; margin-bottom:2px; }
.wcal-gitem{ display:flex; align-items:center; gap:6px; line-height:1.35; cursor:pointer; }
.wcal-gitem .gdot{ width:7px; height:7px; border-radius:50%; flex:none; }
.wcal-gitem .gname{ font-size:12px; color:var(--wink); font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Point-in-time activity (a dose, a reading, a workout) — a compact reminder,
   never stretched into an hour block. Visually distinct from a meeting block:
   light, hairline-bordered, colored left accent, one line. */
.wcal-point{ position:absolute; z-index:3; display:flex; align-items:center; gap:6px; padding:0 8px;
  border-radius:6px; box-sizing:border-box; cursor:pointer; overflow:hidden;
  background:var(--wsurface); border:1px solid var(--wl); border-left:3px solid var(--ec,#79839a); }
.wcal-point .pi{ font-size:12px; flex:none; }
.wcal-point .pt{ font-size:12px; color:var(--wink); font-weight:550; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wcal-point .pm{ font-size:10.5px; color:var(--wmut); font-variant-numeric:tabular-nums; flex:none; }

/* Agenda: group items that share a timestamp */
.wcal-agtime{ display:flex; gap:14px; align-items:baseline; padding:10px 0 2px; border-top:1px solid var(--wl2); }
.wcal-agtime .at{ width:120px; flex:none; font-size:13px; color:var(--wmut); font-variant-numeric:tabular-nums; }
.wcal-agtime .agitems{ flex:1; display:flex; flex-direction:column; gap:6px; }
.wcal-agtime .agi{ display:flex; gap:10px; align-items:center; cursor:pointer; }
.wcal-agtime .agi .adot{ width:9px; height:9px; border-radius:50%; flex:none; }
.wcal-agtime .agi .an{ font-size:14.5px; color:var(--wink); }

/* Week: readability-first columnar list (no cramped time-grid) */
.wcal-wk{ display:flex; overflow-x:auto; padding-bottom:10px; }
.wcal-wkcol{ flex:1 0 130px; min-width:130px; border-left:1px solid var(--wl2); }
.wcal-wkcol:first-child{ border-left:none; }
.wcal-wkcol-head{ position:sticky; top:0; background:var(--wbg); text-align:center; padding:8px 4px 6px; border-bottom:1px solid var(--wl); font-size:12px; color:var(--wmut); }
.wcal-wkcol-head b{ display:block; font-size:18px; color:var(--wink); font-weight:650; margin-top:1px; }
.wcal-wkcol-head.today b{ color:#fff; background:var(--wtoday); width:28px; height:28px; line-height:28px; border-radius:50%; margin:2px auto 0; }
.wcal-wkcol-body{ padding:6px 6px 14px; display:flex; flex-direction:column; gap:8px; }
.wcal-wkcol-empty{ font-size:12px; color:var(--wfaint); text-align:center; padding:10px 0; }
.wcal-wkgroup .wgtime{ font-size:10.5px; color:var(--wmut); font-variant-numeric:tabular-nums; margin-bottom:3px; letter-spacing:.02em; }
.wcal-wkitem{ display:flex; gap:6px; align-items:flex-start; padding:2px 0; cursor:pointer; }
.wcal-wkitem .widot{ width:7px; height:7px; border-radius:50%; flex:none; margin-top:5px; }
.wcal-wkitem .winame{ font-size:12.5px; color:var(--wink); line-height:1.3; }
.wcal-wkmore{ font-size:11.5px; color:var(--wtoday); cursor:pointer; padding-top:2px; font-weight:600; }
</style>
{% endblock %}

{% block content %}
<div class="wcal">
  <div class="wcal-bar">
    <div class="wcal-title" id="wcal-title">…</div>
    <div class="wcal-nav">
      <button id="wcal-prev" aria-label="Previous">‹</button>
      <button id="wcal-today">Today</button>
      <button id="wcal-next" aria-label="Next">›</button>
    </div>
    <div class="wcal-tabs" id="wcal-tabs">
      <button data-v="day" class="on">Day</button>
      <button data-v="week">Week</button>
      <button data-v="month">Month</button>
      <button data-v="agenda">Agenda</button>
    </div>
  </div>
  <div class="wcal-body" id="wcal-body"><div class="wcal-loading">Loading…</div></div>
</div>

<script nonce="{{ csp_nonce }}">
(function(){
  'use strict';
  var CSRF = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '{{ csrf_token }}';
  var HH = 44;           // pixels per hour
  var view = 'day';
  var anchor = new Date();
  var body = document.getElementById('wcal-body');
  var titleEl = document.getElementById('wcal-title');

  // ── owner routing (Calendar reveals; click opens the owning module) ──
  var SOURCE_URLS = {
    'task':'/life/tasks/{id}/edit/','life_event':'/life/events/{id}/edit/',
    'goal':'/purpose/goals/{id}/','goal_milestone':'/purpose/milestones/{id}/edit/',
    'habit':'/purpose/habits/{id}/','medicine_schedule':'/health/physical/intake/',
    'workout_schedule':'/health/physical/fitness/workouts/','faith_routine':'/faith/reading-plans/',
    'availability':"{% url 'calendar_engine:availability' %}"
  };
  function openOwner(st, sid){
    var u = SOURCE_URLS[st];
    if(st && st!=='none' && u){ window.location.href = u.indexOf('{id}')>=0 ? u.replace('{id}', sid) : u; }
  }
  body.addEventListener('click', function(e){
    var it = e.target.closest('[data-st]'); if(!it) return;
    if(it.dataset.day){ view='day'; anchor=new Date(it.dataset.day+'T12:00:00'); setTab(); render(); return; }
    // A grouped activity carries the owning module's canonical URL.
    if(it.dataset.url){ window.location.href = it.dataset.url; return; }
    openOwner(it.dataset.st, it.dataset.sid);
  });

  // ── helpers ──
  function api(u){ return fetch(u,{credentials:'same-origin',headers:{'X-CSRFToken':CSRF}}).then(function(r){return r.json();}); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function mins(s){ var m=(s||'').match(/T(\d{2}):(\d{2})/); return m?parseInt(m[1],10)*60+parseInt(m[2],10):0; }
  function dstr(s){ return (s||'').slice(0,10); }
  function fmtT(s){ var m=(s||'').match(/T(\d{2}):(\d{2})/); if(!m)return ''; var h=+m[1],ap=h>=12?'PM':'AM'; h=h%12||12; return h+(m[2]==='00'?'':':'+m[2])+' '+ap; }
  function hexA(hex,a){ hex=(hex||'#79839a').replace('#',''); if(hex.length===3)hex=hex.split('').map(function(c){return c+c;}).join(''); var n=parseInt(hex,16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
  function isTimeless(e){ return e.is_all_day || e.event_kind==='deadline_marker'; }
  function isAvail(e){ return e.event_kind==='availability'; }
  function cleanTitle(t){ return (t||'').replace(/^Due:\s*/,''); }
  // Show the user-facing activity name (server sends display_title); never a template name.
  function nameOf(e){ return cleanTitle(e.display_title || e.title); }
  function dot(c){ return '<span class="gdot" style="background:'+(c||'#79839a')+'"></span>'; }
  function itemAttrs(e){ return 'data-st="'+esc(e.source_type)+'" data-sid="'+esc(e.source_id)+'"'; }

  // ── activities: the Calendar shows WHAT to do, the module owns HOW ──
  // The server tags projectable events with a module-owned `activity`
  // {key,label,icon,unit,url}. Events sharing an activity key on a day collapse
  // into ONE chip (Morning Medications ×5, Workout, Bible Reading). Items with no
  // activity (tasks, appointments, relationships) stay individual.
  function plural(u,n){ return n===1 ? u : u+'s'; }
  function countSuffix(it){ return (it.unit && it.count>1) ? ' ('+it.count+' '+plural(it.unit,it.count)+')' : ''; }
  function chipText(it){ return (it.icon? it.icon+' ' : '') + cleanTitle(it.display_title||it.title) + countSuffix(it); }
  function chipMark(it){ return it.icon ? '' : dot(it.domain_color); }   // icon replaces the color dot
  function chipAttrs(it){ return 'data-st="'+esc(it.source_type)+'" data-sid="'+esc(it.source_id)+'"'+(it.url? ' data-url="'+esc(it.url)+'"' : ''); }

  function toActivities(evs){
    var groups={}, order=[];
    evs.forEach(function(e){
      var a=e.activity;
      var key = a ? ('act:'+a.key) : ('one:'+e.source_type+':'+e.source_id+':'+(e.start_dt||''));
      if(!(key in groups)){ groups[key]={members:[]}; order.push(key); }
      groups[key].members.push(e);
    });
    return order.map(function(k){
      var m=groups[k].members.slice().sort(function(x,y){ return (x.start_dt<y.start_dt)?-1:((x.start_dt>y.start_dt)?1:0); });
      var first=m[0], a=first.activity, maxEnd=first.end_dt;
      m.forEach(function(e){ if(e.end_dt>maxEnd) maxEnd=e.end_dt; });
      var label = a ? a.label : (first.display_title||first.title);
      return { title:label, display_title:label, icon:(a?a.icon||'':''), unit:(a?a.unit||'':''),
        count:m.length, url:(a?a.url||null:null), point:(a?!!a.point:false),
        start_dt:first.start_dt, end_dt:maxEnd,
        is_all_day:first.is_all_day, event_kind:first.event_kind,
        source_type:first.source_type, source_id:first.source_id, domain_color:first.domain_color };
    });
  }

  // Group a day's timed events by identical timestamp → [{label, mins, items:[...]}]
  function groupByTime(evs){
    var buckets={}, order=[];
    evs.slice().sort(function(a,b){ return mins(a.start_dt)-mins(b.start_dt); }).forEach(function(e){
      var k=mins(e.start_dt); if(!(k in buckets)){ buckets[k]=[]; order.push(k); } buckets[k].push(e);
    });
    return order.map(function(k){ return { mins:k, label:fmtT(buckets[k][0].start_dt), items:buckets[k] }; });
  }

  // Column-packing layout for nodes that already carry _s/_e (single events OR groups)
  function layoutNodes(nodes){
    nodes.sort(function(a,b){ return a._s-b._s || a._e-b._e; });
    var cluster=[], clEnd=-1;
    function flush(){ if(!cluster.length) return; var cols=[];
      cluster.forEach(function(e){ var placed=false;
        for(var i=0;i<cols.length;i++){ if(cols[i]<=e._s){ e._col=i; cols[i]=e._e; placed=true; break; } }
        if(!placed){ e._col=cols.length; cols.push(e._e); } });
      cluster.forEach(function(e){ e._cols=cols.length; }); cluster=[]; clEnd=-1; }
    nodes.forEach(function(e){ if(cluster.length && e._s>=clEnd) flush(); cluster.push(e); clEnd=Math.max(clEnd,e._e); });
    flush(); return nodes;
  }

  // Collapse same-start events into group nodes; reserve visual height so packing
  // accounts for the stacked list (readability over strict proportional height).
  var POINT_MIN = 30;  // compact visual height for a point-in-time activity (~22px)
  function dayNodes(evs){
    // Point-in-time activities never stretch: a dose/reading is an instant, not a
    // block. Duration events (meetings) keep their real height.
    evs.forEach(function(e){ e._s=mins(e.start_dt);
      e._e = e.point ? (e._s+POINT_MIN) : Math.max(e._s+20, mins(e.end_dt)); });
    var buckets={}, order=[];
    evs.forEach(function(e){ var k=e._s; if(!(k in buckets)){ buckets[k]=[]; order.push(k); } buckets[k].push(e); });
    var nodes = order.map(function(k){
      var items=buckets[k]; var maxE=Math.max.apply(null, items.map(function(x){return x._e;}));
      if(items.length===1) return { _s:k, _e:maxE, single:items[0] };
      var needPx = 16 + items.length*18 + 6;            // time label + rows + pad
      var needMin = needPx/HH*60;
      return { _s:k, _e:Math.max(maxE, k+needMin), group:items };
    });
    return layoutNodes(nodes);
  }

  function posStyle(node){
    var top=(node._s/60)*HH, h=Math.max(20,((node._e-node._s)/60)*HH);
    var w=100/(node._cols||1), left=(node._col||0)*w;
    return 'top:'+top+'px;height:'+(h-2)+'px;left:calc('+left+'% + 2px);width:calc('+w+'% - 4px);';
  }
  function pointLabel(it){ return cleanTitle(it.display_title||it.title)+countSuffix(it); }
  // A compact reminder-style entry — icon · name · time — never a stretched block.
  function pointBlock(node){
    var e=node.single;
    return '<div class="wcal-point" '+chipAttrs(e)+' style="'+posStyle(node)+'--ec:'+(e.domain_color||'#79839a')+'">'+
      '<span class="pi">'+(e.icon||'•')+'</span><span class="pt">'+esc(pointLabel(e))+'</span>'+
      '<span class="pm">'+fmtT(e.start_dt)+'</span></div>';
  }
  function singleBlock(node){
    if(node.single.point) return pointBlock(node);
    var e=node.single, h=Math.max(20,((node._e-node._s)/60)*HH);
    return '<div class="wcal-ev" '+chipAttrs(e)+' style="'+posStyle(node)+
      '--ec:'+(e.domain_color||'#79839a')+';--eb:'+hexA(e.domain_color,0.13)+'">'+
      '<div class="et">'+esc(chipText(e))+'</div>'+(h>34?'<div class="em">'+fmtT(e.start_dt)+'</div>':'')+'</div>';
  }
  function groupBlock(node){
    var first=node.group[0];
    var rows=node.group.map(function(e){ return '<div class="wcal-gitem" '+chipAttrs(e)+'>'+
      chipMark(e)+'<span class="gname">'+esc(chipText(e))+'</span></div>'; }).join('');
    return '<div class="wcal-evgroup" style="'+posStyle(node)+
      '--ec:'+(first.domain_color||'#79839a')+';--eb:rgba(120,120,120,.05)">'+
      '<div class="wcal-gtime">'+fmtT(first.start_dt)+'</div>'+rows+'</div>';
  }

  function railHtml(){ var h=''; for(var i=0;i<24;i++){ var ap=i>=12?'PM':'AM',hr=i%12||12; h+='<div class="wcal-hr"><span>'+(i===0?'':hr+' '+ap)+'</span></div>'; } return h; }
  function availHtml(evs){ var h=''; evs.filter(isAvail).forEach(function(a){ if(a.is_available) return; var t=(mins(a.start_dt)/60)*HH, ht=((mins(a.end_dt)-mins(a.start_dt))/60)*HH; h+='<div class="wcal-avail" style="top:'+t+'px;height:'+ht+'px"><span class="al">'+esc(a.title)+'</span></div>'; }); return h; }
  function nowHtml(dayIso){ var n=new Date(); if(iso(n)!==dayIso) return ''; var t=(n.getHours()*60+n.getMinutes())/60*HH; return '<div class="wcal-now" style="top:'+t+'px"></div>'; }
  function alldayChips(evs){ return toActivities(evs.filter(isTimeless)).map(function(it){ return '<div class="wcal-chip" '+chipAttrs(it)+' style="background:'+(it.domain_color||'#79839a')+'">'+esc(chipText(it))+'</div>'; }).join(''); }

  // ── DAY ──
  function renderDay(evs){
    var d=iso(anchor); titleEl.textContent = anchor.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    var nodes=dayNodes(toActivities(evs.filter(function(e){ return !isTimeless(e) && !isAvail(e); })));
    var blocks=nodes.map(function(n){ return n.single?singleBlock(n):groupBlock(n); }).join('');
    var h='<div class="wcal-allday"><div class="wcal-rail">All-day</div><div class="wcal-allday-cells"><div class="wcal-allday-cell">'+alldayChips(evs)+'</div></div></div>';
    h+='<div class="wcal-scroll" id="wcal-scroll"><div class="wcal-tg"><div class="wcal-rail">'+railHtml()+'</div>'+
       '<div class="wcal-cols"><div class="wcal-col">'+availHtml(evs)+nowHtml(d)+blocks+'</div></div></div></div>';
    body.innerHTML=h; autoScroll();
  }

  // ── WEEK ── readability-first: 7 vertical day-columns, items grouped by time.
  var WEEK_CAP = 9;  // items shown per day before a "+N more" affordance
  function renderWeek(evs){
    var mon=new Date(anchor); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
    var days=[]; for(var i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d); }
    titleEl.textContent = days[0].toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+days[6].toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    var todayIso=iso(new Date());
    var cols=days.map(function(d){
      var di=iso(d), isT=di===todayIso;
      var de=toActivities(evs.filter(function(e){ return dstr(e.start_dt)===di && !isAvail(e); }));
      var timeless=de.filter(isTimeless), timed=de.filter(function(e){ return !isTimeless(e); });
      var body='';
      // all-day / due first
      timeless.forEach(function(it){ body+='<div class="wcal-wkitem" '+chipAttrs(it)+'>'+chipMark(it)+'<span class="winame">'+esc(chipText(it))+'</span></div>'; });
      // timed, grouped by identical timestamp (time shown once), capped
      var groups=groupByTime(timed), shown=0, hidden=0;
      groups.forEach(function(g){
        if(shown>=WEEK_CAP){ hidden+=g.items.length; return; }
        var rows='';
        g.items.forEach(function(it){ if(shown>=WEEK_CAP){ hidden++; return; }
          rows+='<div class="wcal-wkitem" '+chipAttrs(it)+'>'+chipMark(it)+'<span class="winame">'+esc(chipText(it))+'</span></div>'; shown++; });
        if(rows) body+='<div class="wcal-wkgroup"><div class="wgtime">'+g.label+'</div>'+rows+'</div>';
      });
      if(hidden>0) body+='<div class="wcal-wkmore" data-st="none" data-day="'+di+'">+'+hidden+' more</div>';
      if(!body) body='<div class="wcal-wkcol-empty">—</div>';
      return '<div class="wcal-wkcol">'+
        '<div class="wcal-wkcol-head'+(isT?' today':'')+'">'+d.toLocaleDateString(undefined,{weekday:'short'})+'<b>'+d.getDate()+'</b></div>'+
        '<div class="wcal-wkcol-body">'+body+'</div></div>';
    }).join('');
    body.innerHTML='<div class="wcal-wk">'+cols+'</div>';
  }

  // ── MONTH ──
  function renderMonth(data){
    var y=anchor.getFullYear(), mo=anchor.getMonth();
    titleEl.textContent = anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    var byDay={}; (data.events||[]).forEach(function(e){ var d=dstr(e.start_dt); (byDay[d]=byDay[d]||[]).push(e); });
    var first=new Date(y,mo,1); var start=new Date(first); start.setDate(1-((first.getDay()+7)%7)); // Sunday start
    var todayIso=iso(new Date());
    var head='<div class="wcal-mhead">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>';
    var cells='';
    for(var i=0;i<42;i++){ var d=new Date(start); d.setDate(start.getDate()+i); var di=iso(d); var out=d.getMonth()!==mo;
      var acts=toActivities(byDay[di]||[]).sort(function(a,b){return mins(a.start_dt)-mins(b.start_dt);});
      var chips=''; acts.slice(0,3).forEach(function(it){ chips+='<div class="mchip" '+chipAttrs(it)+' style="background:'+(it.domain_color||'#79839a')+'">'+(isTimeless(it)?'':fmtT(it.start_dt)+' ')+esc(chipText(it))+'</div>'; });
      if(acts.length>3) chips+='<div class="mmore">+'+(acts.length-3)+' more</div>';
      cells+='<div class="wcal-mc'+(out?' out':'')+(di===todayIso?' today':'')+'" data-st="none" data-day="'+di+'"><div class="md">'+d.getDate()+'</div>'+chips+'</div>';
    }
    body.innerHTML='<div class="wcal-month">'+head+'<div class="wcal-mgrid">'+cells+'</div></div>';
  }

  // ── AGENDA ──
  function renderAgenda(evs){
    titleEl.textContent = 'Agenda';
    var byDay={}, order=[];
    evs.filter(function(e){ return !isAvail(e); }).forEach(function(e){
      var d=dstr(e.start_dt); if(!byDay[d]){byDay[d]=[];order.push(d);} byDay[d].push(e); });
    order.sort();
    if(!order.length){ body.innerHTML='<div class="wcal-empty">Nothing scheduled.</div>'; return; }
    var todayIso=iso(new Date());
    function timeRow(label, items){
      var lis=items.map(function(it){ return '<div class="agi" '+chipAttrs(it)+'>'+(it.icon? '<span class="an" style="width:auto">'+it.icon+'</span>' : '<span class="adot" style="background:'+(it.domain_color||'#79839a')+'"></span>')+'<span class="an">'+esc(cleanTitle(it.display_title||it.title)+countSuffix(it))+'</span></div>'; }).join('');
      return '<div class="wcal-agtime"><span class="at">'+label+'</span><div class="agitems">'+lis+'</div></div>';
    }
    var h='<div class="wcal-ag">';
    order.forEach(function(d){ var dd=new Date(d+'T12:00:00');
      h+='<div class="wcal-agday"><span class="d1">'+(d===todayIso?'Today':dd.toLocaleDateString(undefined,{weekday:'long'}))+'</span><span class="d2">'+dd.toLocaleDateString(undefined,{month:'long',day:'numeric'})+'</span></div>';
      var de=toActivities(byDay[d]), timeless=de.filter(isTimeless), timed=de.filter(function(e){ return !isTimeless(e); });
      groupByTime(timed).forEach(function(g){ h+=timeRow(g.label, g.items); });
      if(timeless.length) h+=timeRow('all-day', timeless);
    });
    body.innerHTML=h+'</div>';
  }

  function autoScroll(){ var s=document.getElementById('wcal-scroll'); if(s){ var n=new Date(); var target=(iso(n)===iso(anchor))?(n.getHours()*60+n.getMinutes()):(7*60); s.scrollTop=Math.max(0,(target/60)*HH-120); } }

  // ── fetch + render ──
  function render(){
    body.innerHTML='<div class="wcal-loading">Loading…</div>';
    if(view==='day'){ var d=iso(anchor); api('/calendar/api/range/?start='+d+'&end='+d).then(function(r){ renderDay(r.events||[]); }); }
    else if(view==='week'){ var mon=new Date(anchor); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); var sun=new Date(mon); sun.setDate(mon.getDate()+6); api('/calendar/api/range/?start='+iso(mon)+'&end='+iso(sun)).then(function(r){ renderWeek(r.events||[]); }); }
    else if(view==='month'){ api('/calendar/api/month/?year='+anchor.getFullYear()+'&month='+(anchor.getMonth()+1)).then(function(r){ renderMonth(r); }); }
    else if(view==='agenda'){ var t=new Date(); var e=new Date(); e.setDate(e.getDate()+21); api('/calendar/api/range/?start='+iso(t)+'&end='+iso(e)).then(function(r){ renderAgenda(r.events||[]); }); }
  }

  function setTab(){ document.querySelectorAll('.wcal-tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.v===view); }); }
  document.getElementById('wcal-tabs').addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b)return; view=b.dataset.v; setTab(); render(); });
  document.getElementById('wcal-today').addEventListener('click', function(){ anchor=new Date(); render(); });
  document.getElementById('wcal-prev').addEventListener('click', function(){ shift(-1); });
  document.getElementById('wcal-next').addEventListener('click', function(){ shift(1); });
  function shift(dir){ if(view==='day'||view==='agenda') anchor.setDate(anchor.getDate()+dir); else if(view==='week') anchor.setDate(anchor.getDate()+7*dir); else anchor.setMonth(anchor.getMonth()+dir); render(); }

  render();
})();
</script>
{% endblock %}

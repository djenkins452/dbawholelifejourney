{% comment %}
Dashboard Tile: AI Insights
Shows personalized daily insight from AI analysis (MANDATORY - cannot be hidden)
{% endcomment %}

{% if ai_enabled and ai_insights %}
<section class="ai-insight-hero tile-size-{{ tile.size|default:'large' }}" data-tile-id="ai_insights">
    <div class="ai-insight-content">
        <div class="ai-badge">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
                <path d="M12 6v6l4 2"/>
            </svg>
            Today's Insight
        </div>
        <p class="ai-insight-text">{{ ai_insights.daily_insight }}</p>
    </div>
</section>
{% endif %}

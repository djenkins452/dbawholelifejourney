{% csrf_token %}

    <div class="v2-card-header">
        <h3 class="v2-card-title">Medicine</h3>
        <span class="v2-count-badge">{{ medicine_done }}/{{ medicine_total }}</span>

    <div class="v2-task-list">
        {% for group in medicine_groups %}

        {% endfor %}
    </div>
</div>

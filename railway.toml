[build]
builder = "nixpacks"
# Add ffmpeg for audio compression in Capture feature (large files need compression for Whisper API)
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py load_initial_data && python manage.py sync_workout_to_templates && python manage.py recalculate_task_priorities && python manage.py collectstatic --noinput && gunicorn config.wsgi --preload --log-file - --timeout 300"

# Force rebuild by adding a version comment
# v2: Added ffmpeg support for 60-minute audio recordings

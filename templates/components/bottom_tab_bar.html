{% load static %}
<!-- Mobile Bottom Tab Bar (Phase 2: Dynamic) -->
<nav class="bottom-tab-bar" aria-label="Mobile navigation">
    <!-- Home - Always first -->
    <a href="{% url 'dashboard:home' %}" class="bottom-tab {% if request.resolver_match.app_name == 'dashboard' %}active{% endif %}">
        <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <span class="bottom-tab-label">Home</span>
    </a>

    <!-- Dynamic modules from user preferences (up to 4) -->
    {% for module in nav_modules %}
    <a href="{{ module.url }}" class="bottom-tab {% if request.resolver_match.app_name == module.slug %}active{% endif %}">
        <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            {{ module.icon_svg|safe }}
        </svg>
        <span class="bottom-tab-label">{{ module.name }}</span>
    </a>
    {% empty %}
    <!-- Fallback to static modules if nav_modules not available -->
    {% if journal_enabled %}
    <a href="{% url 'journal:home' %}" class="bottom-tab {% if request.resolver_match.app_name == 'journal' %}active{% endif %}">
        <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span class="bottom-tab-label">Journal</span>
    </a>
    {% endif %}
    {% if health_enabled %}
    <a href="{% url 'health:home' %}" class="bottom-tab {% if request.resolver_match.app_name == 'health' or request.resolver_match.app_name == 'medical' %}active{% endif %}">
        <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span class="bottom-tab-label">Health</span>
    </a>
    {% endif %}
    {% if faith_enabled %}
    <a href="{% url 'faith:home' %}" class="bottom-tab {% if request.resolver_match.app_name == 'faith' %}active{% endif %}">
        <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M7 7h10"/>
        </svg>
        <span class="bottom-tab-label">Faith</span>
    </a>
    {% endif %}
    {% endfor %}

    <!-- More - Always last -->
    <a href="{% url 'core:more' %}" class="bottom-tab bottom-tab-more {% if request.resolver_match.url_name == 'more' %}active{% endif %}">
        <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1"/>
            <circle cx="12" cy="5" r="1"/>
            <circle cx="12" cy="19" r="1"/>
        </svg>
        <span class="bottom-tab-label">More</span>
    </a>
</nav>

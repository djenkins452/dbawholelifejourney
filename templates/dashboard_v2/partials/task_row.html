<div class="v2-action-row" id="task-row-{{ task.pk }}">
    <button class="v2-action-toggle {% if task.is_completed %}v2-completed{% endif %}"
            hx-post="{% url 'dashboard_v2:task_toggle' pk=task.pk %}"
            hx-target="#task-row-{{ task.pk }}"
            hx-swap="outerHTML">
        {% if task.is_completed %}
            <span class="v2-check">&#10003;</span>
        {% else %}
            <span class="v2-check-empty">&#9675;</span>
        {% endif %}
    </button>
    <div class="v2-action-content">
        <span class="v2-action-title {% if task.is_completed %}v2-strikethrough{% endif %}">{{ task.title }}</span>
        {% if task.due_date and task.is_overdue %}
            <span class="v2-action-badge v2-badge-overdue">Overdue</span>
        {% endif %}
        {% if task.commitment_level == "foundational" %}
            <span class="v2-action-badge v2-badge-priority">Foundational</span>
        {% endif %}
        {% if task.goal_name %}
            <span class="v2-goal-tag">{{ task.goal_name }}</span>
        {% endif %}
    </div>
</div>

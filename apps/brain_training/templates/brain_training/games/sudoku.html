{% extends "brain_training/games/base_game.html" %}

{% block game_css %}
<style>
    .sudoku-board {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 1px;
        background: var(--color-border);
        border: 2px solid var(--color-text);
        max-width: 400px;
        width: 100%;
        aspect-ratio: 1;
        border-radius: var(--radius-md);
        overflow: hidden;
    }

    .sudoku-cell {
        background: var(--color-background);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s;
        position: relative;
    }

    .sudoku-cell.given {
        background: var(--color-surface);
        cursor: default;
        font-weight: 700;
        color: var(--color-text);
    }

    .sudoku-cell.selected {
        background: color-mix(in srgb, var(--color-accent) 20%, transparent);
    }

    .sudoku-cell.same-value {
        background: color-mix(in srgb, var(--color-accent) 10%, transparent);
    }

    .sudoku-cell.error {
        color: #ef4444;
        background: color-mix(in srgb, #ef4444 10%, transparent);
    }

    .sudoku-cell.hint {
        animation: hint-pulse 1s ease-in-out;
    }

    @keyframes hint-pulse {
        0%, 100% { background: var(--color-background); }
        50% { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
    }

    /* Notes/pencil marks display */
    .sudoku-cell .cell-value {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }

    .sudoku-cell .cell-notes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        width: 100%;
        height: 100%;
        padding: 2px;
    }

    .sudoku-cell .cell-notes span {
        font-size: clamp(0.4rem, 1.5vw, 0.6rem);
        color: var(--color-text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Box borders */
    .sudoku-cell:nth-child(3n) {
        border-right: 2px solid var(--color-text);
    }

    .sudoku-cell:nth-child(9n) {
        border-right: none;
    }

    .sudoku-cell:nth-child(n+19):nth-child(-n+27),
    .sudoku-cell:nth-child(n+46):nth-child(-n+54) {
        border-bottom: 2px solid var(--color-text);
    }

    /* Number pad */
    .number-pad {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: var(--space-2);
        max-width: 300px;
        width: 100%;
        margin-top: var(--space-4);
    }

    .number-btn {
        padding: var(--space-3);
        font-size: 1.25rem;
        font-weight: 600;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text);
        cursor: pointer;
        transition: all 0.15s;
    }

    .number-btn:hover {
        background: var(--color-accent);
        color: white;
    }

    .number-btn.erase {
        grid-column: span 1;
    }

    .number-btn.notes-toggle {
        grid-column: span 1;
        font-size: 0.75rem;
    }

    .number-btn.notes-toggle.active {
        background: var(--color-accent);
        color: white;
    }

    @media (max-width: 480px) {
        .sudoku-board {
            max-width: 100%;
        }
    }
</style>
{% endblock %}

{% block game_area %}
<div class="sudoku-board" id="sudoku-board">
    <!-- Cells generated by JS -->
</div>
<div class="number-pad" id="number-pad">
    <button class="number-btn" data-value="1">1</button>
    <button class="number-btn" data-value="2">2</button>
    <button class="number-btn" data-value="3">3</button>
    <button class="number-btn" data-value="4">4</button>
    <button class="number-btn" data-value="5">5</button>
    <button class="number-btn" data-value="6">6</button>
    <button class="number-btn" data-value="7">7</button>
    <button class="number-btn" data-value="8">8</button>
    <button class="number-btn" data-value="9">9</button>
    <button class="number-btn erase" data-value="0">Clear</button>
    <button class="number-btn notes-toggle" id="notes-toggle" title="Toggle Notes Mode">Notes</button>
</div>
{% endblock %}

{% block game_js %}
<script>
    // Sudoku-specific game logic
    const SudokuGame = Object.assign(Object.create(BrainGame), {
        puzzleGrid: [],
        userGrid: [],
        notesGrid: [], // 2D array of Sets for pencil marks
        selectedCell: null,
        notesMode: false,

        init() {
            BrainGame.init.call(this);
            this.bindSudokuEvents();
        },

        bindSudokuEvents() {
            // Number pad clicks
            document.querySelectorAll('.number-btn:not(.notes-toggle)').forEach(btn => {
                btn.addEventListener('click', () => {
                    const value = parseInt(btn.dataset.value, 10);
                    this.enterNumber(value);
                });
            });

            // Notes toggle button
            document.getElementById('notes-toggle').addEventListener('click', () => {
                this.notesMode = !this.notesMode;
                document.getElementById('notes-toggle').classList.toggle('active', this.notesMode);
            });

            // Keyboard input
            document.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '9') {
                    this.enterNumber(parseInt(e.key, 10));
                } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
                    this.enterNumber(0);
                } else if (e.key === 'ArrowUp' && this.selectedCell !== null) {
                    e.preventDefault();
                    this.moveSelection(-9);
                } else if (e.key === 'ArrowDown' && this.selectedCell !== null) {
                    e.preventDefault();
                    this.moveSelection(9);
                } else if (e.key === 'ArrowLeft' && this.selectedCell !== null) {
                    e.preventDefault();
                    this.moveSelection(-1);
                } else if (e.key === 'ArrowRight' && this.selectedCell !== null) {
                    e.preventDefault();
                    this.moveSelection(1);
                } else if (e.key === 'n' || e.key === 'N') {
                    // Toggle notes mode with 'n' key
                    this.notesMode = !this.notesMode;
                    document.getElementById('notes-toggle').classList.toggle('active', this.notesMode);
                }
            });
        },

        renderPuzzle(puzzleData) {
            this.puzzleGrid = puzzleData.grid;
            this.userGrid = JSON.parse(JSON.stringify(puzzleData.grid));
            this.initNotesGrid();
            this.selectedCell = null;
            this.notesMode = false;
            document.getElementById('notes-toggle').classList.remove('active');

            this.renderBoard();
        },

        initNotesGrid() {
            this.notesGrid = [];
            for (let r = 0; r < 9; r++) {
                this.notesGrid[r] = [];
                for (let c = 0; c < 9; c++) {
                    this.notesGrid[r][c] = new Set();
                }
            }
        },

        renderBoard() {
            const board = document.getElementById('sudoku-board');
            board.innerHTML = '';

            for (let i = 0; i < 81; i++) {
                const row = Math.floor(i / 9);
                const col = i % 9;
                const value = this.puzzleGrid[row][col];
                const userValue = this.userGrid[row][col];

                const cell = document.createElement('div');
                cell.className = 'sudoku-cell';
                cell.dataset.index = i;

                if (value !== 0) {
                    // Given cell
                    cell.innerHTML = `<span class="cell-value">${value}</span>`;
                    cell.classList.add('given');
                } else if (userValue !== 0) {
                    // User-entered value
                    cell.innerHTML = `<span class="cell-value">${userValue}</span>`;
                    if (this.hasConflict(row, col, userValue)) {
                        cell.classList.add('error');
                    }
                } else {
                    // Empty cell - show notes if any
                    const notes = this.notesGrid[row][col];
                    if (notes.size > 0) {
                        cell.innerHTML = this.renderNotes(notes);
                    }
                }

                cell.addEventListener('click', () => this.selectCell(i));
                board.appendChild(cell);
            }
        },

        renderNotes(notes) {
            let html = '<div class="cell-notes">';
            for (let n = 1; n <= 9; n++) {
                html += `<span>${notes.has(n) ? n : ''}</span>`;
            }
            html += '</div>';
            return html;
        },

        selectCell(index) {
            const row = Math.floor(index / 9);
            const col = index % 9;

            // Can't select given cells
            if (this.puzzleGrid[row][col] !== 0) {
                return;
            }

            // Clear previous selection
            document.querySelectorAll('.sudoku-cell').forEach(c => {
                c.classList.remove('selected', 'same-value');
            });

            this.selectedCell = index;
            const cells = document.querySelectorAll('.sudoku-cell');
            cells[index].classList.add('selected');

            // Highlight same values
            const value = this.userGrid[row][col];
            if (value !== 0) {
                cells.forEach((cell, i) => {
                    const r = Math.floor(i / 9);
                    const c = i % 9;
                    if (this.userGrid[r][c] === value && i !== index) {
                        cell.classList.add('same-value');
                    }
                });
            }
        },

        enterNumber(value) {
            if (this.selectedCell === null) return;

            const row = Math.floor(this.selectedCell / 9);
            const col = this.selectedCell % 9;

            // Can't modify given cells
            if (this.puzzleGrid[row][col] !== 0) return;

            if (this.notesMode && value !== 0) {
                // Toggle note
                const notes = this.notesGrid[row][col];
                if (notes.has(value)) {
                    notes.delete(value);
                } else {
                    notes.add(value);
                }
                // Clear main value when adding notes
                this.userGrid[row][col] = 0;
            } else {
                // Enter value (or clear with 0)
                this.userGrid[row][col] = value;
                // Clear notes when entering a value
                if (value !== 0) {
                    this.notesGrid[row][col].clear();
                }
            }

            // Re-render the board to update display
            this.renderBoard();
            // Re-select the cell
            if (this.selectedCell !== null) {
                const cells = document.querySelectorAll('.sudoku-cell');
                cells[this.selectedCell].classList.add('selected');
            }
        },

        moveSelection(delta) {
            let newIndex = this.selectedCell + delta;
            if (newIndex >= 0 && newIndex < 81) {
                // Find next non-given cell
                const row = Math.floor(newIndex / 9);
                const col = newIndex % 9;
                if (this.puzzleGrid[row][col] === 0) {
                    this.selectCell(newIndex);
                } else {
                    // Try to find next available
                    this.selectedCell = newIndex;
                    this.moveSelection(delta > 0 ? 1 : -1);
                }
            }
        },

        hasConflict(row, col, value) {
            // Check row
            for (let c = 0; c < 9; c++) {
                if (c !== col && this.userGrid[row][c] === value) return true;
            }

            // Check column
            for (let r = 0; r < 9; r++) {
                if (r !== row && this.userGrid[r][col] === value) return true;
            }

            // Check box
            const boxRow = Math.floor(row / 3) * 3;
            const boxCol = Math.floor(col / 3) * 3;
            for (let r = boxRow; r < boxRow + 3; r++) {
                for (let c = boxCol; c < boxCol + 3; c++) {
                    if ((r !== row || c !== col) && this.userGrid[r][c] === value) return true;
                }
            }

            return false;
        },

        checkSolution() {
            // Check if grid is complete
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (this.userGrid[r][c] === 0) {
                        alert('Please fill all cells before checking.');
                        return;
                    }
                }
            }

            this.completeSession({ grid: this.userGrid });
        },

        useHint() {
            BrainGame.useHint.call(this);

            // Find first empty cell and show a brief highlight
            for (let i = 0; i < 81; i++) {
                const row = Math.floor(i / 9);
                const col = i % 9;
                if (this.puzzleGrid[row][col] === 0 && this.userGrid[row][col] === 0) {
                    const cells = document.querySelectorAll('.sudoku-cell');
                    cells[i].classList.add('hint');
                    setTimeout(() => cells[i].classList.remove('hint'), 1000);
                    this.selectCell(i);
                    break;
                }
            }
        },

        // Override getState to include notes
        getState() {
            // Convert Sets to arrays for JSON serialization
            const notesArray = this.notesGrid.map(row =>
                row.map(cell => Array.from(cell))
            );
            return {
                userGrid: this.userGrid,
                notes: notesArray,
            };
        },

        // Override restoreState to restore notes
        restoreState(state) {
            if (state.userGrid) {
                this.userGrid = state.userGrid;
            }
            if (state.notes) {
                this.notesGrid = state.notes.map(row =>
                    row.map(cell => new Set(cell))
                );
            }
            this.renderBoard();
        }
    });

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
        SudokuGame.init();
    });
</script>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired - Whole Life Journey</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/common/logo.svg' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--color-bg, #f5f5f5);
        }
        .error-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.75rem;
            color: var(--color-text, #333);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .error-subtitle {
            font-size: 1.1rem;
            color: var(--color-text-muted, #666);
            margin-bottom: 1.5rem;
        }
        .error-message {
            color: var(--color-text-muted, #666);
            margin-bottom: 1.5rem;
            max-width: 400px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        .btn-primary {
            background: var(--color-accent, #6366f1);
            color: white;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: var(--color-surface, #fff);
            color: var(--color-text, #333);
            border: 1px solid var(--color-border, #ddd);
        }
        .btn-secondary:hover {
            background: var(--color-bg-hover, #f0f0f0);
        }
        @media (max-width: 480px) {
            .error-logo {
                width: 60px;
                height: 60px;
            }
            .error-title {
                font-size: 1.5rem;
            }
            .error-actions {
                flex-direction: column;
                width: 100%;
                max-width: 280px;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="{% static 'icons/common/logo.svg' %}" alt="Whole Life Journey" class="error-logo">
        <h1 class="error-title">Session Expired</h1>
        <p class="error-subtitle">Your security token has expired</p>
        <p class="error-message">
            This can happen when the page has been open for a while or
            cookies weren't loaded properly. Just reload and try again.
        </p>
        <div class="error-actions">
            <a href="/accounts/login/" class="btn btn-primary">Try Again</a>
            <a href="/" class="btn btn-secondary">Go to Home</a>
        </div>
    </div>
</body>
</html>

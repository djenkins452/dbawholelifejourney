version: "1.0"
suite: "Smoke Tests — Cross-Module Essentials"
module: "smoke"

auth:
  strategy: "session"
  username: "${TEST_USERNAME}"
  password: "${TEST_PASSWORD}"
  login_url: "/accounts/login/"

defaults:
  timeout_ms: 5000
  base_url: "${BASE_URL}"
  screenshot_on_failure: true
  html_dump_on_failure: true

cases:
  - id: "SMK-001"
    name: "Login to application"
    priority: "high"
    tags: ["smoke", "auth"]
    steps:
      - action: "NAVIGATE"
        url: "/accounts/login/"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-email-input"
        input: "${TEST_USERNAME}"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-password-input"
        input: "${TEST_PASSWORD}"
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "login-submit-button"
      - action: "WAIT"
        timeout_ms: 3000
    asserts:
      - type: "url_contains"
        expected: "/dashboard/"
      - type: "element_not_visible"
        selector:
          strategy: "data-testid"
          value: "login-form"

  - id: "SMK-002"
    name: "Create a journal entry (smoke)"
    priority: "high"
    tags: ["smoke", "journal", "crud"]
    steps:
      - action: "NAVIGATE"
        url: "/journal/new/"
      - action: "WAIT"
        timeout_ms: 2000
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "journal-entry-title-input"
        input: "AUTOTEST|smoke|${RUN_ID}|Smoke Entry"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "journal-entry-body-textarea"
        input: "Cross-module smoke test entry. Created by WLJ UI test framework smoke suite."
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "journal-entry-save-button"
      - action: "WAIT"
        timeout_ms: 3000
    asserts:
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "journal-entry-detail"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "journal-entry-detail-title"
        expected: "AUTOTEST|smoke|${RUN_ID}|Smoke Entry"

  - id: "SMK-003"
    name: "Verify journal entry in list (smoke)"
    priority: "high"
    tags: ["smoke", "journal", "crud"]
    steps:
      - action: "NAVIGATE"
        url: "/journal/entries/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "journal-entry-list"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "journal-entry-list"
        expected: "AUTOTEST|smoke|${RUN_ID}|Smoke Entry"

  - id: "SMK-004"
    name: "Cleanup AUTOTEST smoke entries"
    priority: "high"
    tags: ["cleanup"]
    cleanup_scope: "AUTOTEST|smoke|${RUN_ID}|"
    steps:
      - action: "NAVIGATE"
        url: "/journal/entries/?search=AUTOTEST%7Csmoke%7C${RUN_ID}%7C"
        description: "Search entry list filtered to this smoke RUN_ID"
      - action: "WAIT"
        timeout_ms: 2000
    cleanup:
      - action: "CLICK"
        selector:
          strategy: "text_contains"
          value: "AUTOTEST|smoke|${RUN_ID}|"
        description: "Click the AUTOTEST smoke entry scoped to this RUN_ID"
      - action: "WAIT"
        timeout_ms: 1000
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "journal-entry-delete-button"
        description: "Soft-delete the AUTOTEST smoke entry"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "url_contains"
        expected: "/journal/"

[build]
builder = "nixpacks"
# System packages required for WeasyPrint PDF generation
nixpkgsArchive = "nixos-23.11"

[build.nixPkgs]
pkgs = ["cairo", "pango", "gdk-pixbuf", "glib", "fontconfig", "freetype", "harfbuzz"]

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py load_initial_data && python manage.py sync_workout_to_templates && python manage.py recalculate_task_priorities && python manage.py collectstatic --noinput && gunicorn config.wsgi --preload --log-file -"

      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-site-config"
        expected: "Branding"

  # ============================================================
  # UI TEST RUNNER
  # ============================================================

  - id: "AC-UITEST-001"
    name: "UI test runner page loads"
    priority: "high"
    tags: ["testing"]
    steps:
      - action: "NAVIGATE"
        url: "/admin-console/ui-tests/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "url_contains"

{% comment %}
Dashboard Tile: Weekly Summary
Shows AI-generated overview of the week
{% endcomment %}

{% if ai_enabled and ai_insights.weekly_summary %}
<section class="weekly-summary-section tile-size-{{ tile.size|default:'medium' }}" data-tile-id="weekly_summary">
    <div class="summary-header">
        <h3>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            Your Week
        </h3>
    </div>
    <p class="summary-text">{{ ai_insights.weekly_summary }}</p>
</section>
{% endif %}

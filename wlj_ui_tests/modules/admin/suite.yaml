version: "1.0"
suite: "Admin Console Module Tests"
module: "admin"

auth:
  strategy: "session"
  username: "${TEST_USERNAME}"
  password: "${TEST_PASSWORD}"
  login_url: "/accounts/login/"

defaults:
  timeout_ms: 5000
  base_url: "${BASE_URL}"
  screenshot_on_failure: true
  html_dump_on_failure: true

cases:

  # ============================================================
  # AUTH
  # ============================================================

  - id: "AC-AUTH-001"
    name: "Login and navigate to admin console"
    priority: "high"
    tags: ["auth", "smoke"]
    steps:
      - action: "NAVIGATE"
        url: "/accounts/logout/"
      - action: "NAVIGATE"
        url: "/accounts/login/"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-email-input"
        input: "${TEST_USERNAME}"
      - action: "TYPE"
        selector:
          strategy: "data-testid"
          value: "login-password-input"
        input: "${TEST_PASSWORD}"
      - action: "CLICK"
        selector:
          strategy: "data-testid"
          value: "login-submit-button"
        timeout_ms: 10000
      - action: "WAIT"
        timeout_ms: 3000
    asserts:
      - type: "url_contains"
        expected: "/dashboard/"

  # ============================================================
  # DASHBOARD
  # ============================================================

  - id: "AC-DASH-001"
    name: "Admin console dashboard loads"
    priority: "high"
    tags: ["dashboard", "smoke"]
    steps:
      - action: "NAVIGATE"
        url: "/admin-console/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "url_contains"
        expected: "/admin-console/"
      - type: "element_visible"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"

  - id: "AC-DASH-002"
    name: "Dashboard shows title"
    priority: "medium"
    tags: ["dashboard"]
    steps:
      - action: "NAVIGATE"
        url: "/admin-console/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"
        expected: "Admin Console"

  - id: "AC-DASH-003"
    name: "Dashboard shows quick stats"
    priority: "medium"
    tags: ["dashboard"]
    steps:
      - action: "NAVIGATE"
        url: "/admin-console/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"
        expected: "Users"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"
        expected: "Journal Entries"

  - id: "AC-DASH-004"
    name: "Dashboard shows admin section cards"
    priority: "medium"
    tags: ["dashboard"]
    steps:
      - action: "NAVIGATE"
        url: "/admin-console/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"
        expected: "Site Configuration"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"
        expected: "Themes"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"
        expected: "Categories"

  - id: "AC-DASH-005"
    name: "Dashboard shows operations and testing cards"
    priority: "medium"
    tags: ["dashboard"]
    steps:
      - action: "NAVIGATE"
        url: "/admin-console/"
      - action: "WAIT"
        timeout_ms: 2000
    asserts:
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"
        expected: "UI Test Runner"
      - type: "text_contains"
        selector:
          strategy: "data-testid"
          value: "ac-dashboard"
        expected: "Test History"

  # ============================================================
  # THEME LIST
  # ============================================================

  - id: "AC-THEME-001"
    name: "Theme list page loads"
    priority: "high"
    tags: ["themes"]

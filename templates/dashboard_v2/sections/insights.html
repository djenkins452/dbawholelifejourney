{% if has_actionable_insights %}
<h2 class="v2-section-title">Insights & Guidance</h2>
<div class="v2-insights-list">
    {% for item in guidance_items %}
    <div class="v2-insight-card v2-priority-{{ item.priority }}">
        <h4 class="v2-insight-title">{{ item.title }}</h4>
        <p class="v2-insight-message">{{ item.message|truncatewords:30 }}</p>
    </div>
    {% endfor %}

    {% if insight %}
    <div class="v2-insight-card v2-insight-{{ insight.severity }}">
        <h4 class="v2-insight-title">{{ insight.title }}</h4>
        <p class="v2-insight-message">{{ insight.message|truncatewords:30 }}</p>
    </div>
    {% endif %}
</div>
{% endif %}

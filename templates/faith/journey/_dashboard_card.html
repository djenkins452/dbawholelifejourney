{% load static %}
{% if card %}
<section class="journey-dashboard-card" data-testid="journey-dashboard-card">
  <style nonce="{{ csp_nonce }}">
    .journey-dashboard-card {
      background: #fdfaf2;
      border: 1px solid #e7e2d6;
      border-left: 3px solid #8b6914;
      border-radius: 6px;
      padding: 22px 24px;
      margin: 24px 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      line-height: 1.6;
      color: #1f2937;
    }
    .journey-dashboard-card .jdc-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8b6914;
      margin-bottom: 8px;
    }
    .journey-dashboard-card .jdc-title {
      font-size: 19px;
      margin: 0 0 4px;
      color: #1f2937;
    }
    .journey-dashboard-card .jdc-position {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 14px;
    }
    .journey-dashboard-card .jdc-focus-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .journey-dashboard-card .jdc-focus {
      font-size: 16px;
      font-style: italic;
      color: #1f2937;
      margin-bottom: 20px;
    }
    .journey-dashboard-card .jdc-cta {
      display: inline-block;
      background: #8b6914;
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 4px;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      min-height: 44px;
      line-height: 20px;
    }
    .journey-dashboard-card .jdc-cta:hover { background: #735612; }
    @media (max-width: 480px) {
      .journey-dashboard-card { padding: 18px 18px; }
      .journey-dashboard-card .jdc-title { font-size: 18px; }
    }
  </style>
  <div class="jdc-tag">Journey</div>
  <h3 class="jdc-title">{{ card.journey_name }}</h3>
  <div class="jdc-position">
    {{ card.arc_name }} · Day {{ card.day_number }}{% if card.total_days %} of {{ card.total_days }}{% endif %}
  </div>
  <div class="jdc-focus-label">Today's focus</div>
  <div class="jdc-focus">{{ card.focus }}</div>
  <a href="{% url 'journey:today' %}" class="jdc-cta">Continue Journey</a>
</section>
{% endif %}
